<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#EDEDED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>仿微信</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307C160'/%3E%3Cpath d='M32 14c-10 0-18 6.6-18 14.8 0 4.6 2.5 8.7 6.4 11.4-.5 2.1-1.6 4-3.1 5.6 3.1-.3 5.9-1.4 8.1-3.1 2 .6 4.2.9 6.6.9 10 0 18-6.6 18-14.8S42 14 32 14z' fill='%23fff'/%3E%3C/svg%3E">
<style>#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDEDED;color:#07C160;font-size:15px;z-index:999}</style>
<style>
/* ================= 仿微信 · 样式 ================= */
:root{
  --green:#07C160; --green-d:#06AD56;
  --bg:#EDEDED; --card:#FFFFFF; --nav:#EDEDED; --tab:#F7F7F7;
  --txt:#191919; --txt2:#576B95; --sub:#A8A8A8; --sub2:#B2B2B2;
  --line:#E6E6E6; --line2:#EDEDED; --red:#FA5151; --orange:#FA9D3B; --blue:#10AEFF;
  --bubble-me:#95EC69; --bubble-me-txt:#191919;
  --bubble-them:#FFFFFF; --bubble-them-txt:#191919;
  --radius:6px; --fs:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --tabh:52px;
}
.dark{
  --bg:#111111; --card:#1E1E1E; --nav:#1A1A1A; --tab:#1A1A1A;
  --txt:#E6E6E6; --txt2:#7FA6D9; --sub:#8A8A8A; --sub2:#8A8A8A;
  --line:#2B2B2B; --line2:#262626;
  --bubble-them:#2C2C2E; --bubble-them-txt:#E6E6E6; --bubble-me-txt:#0E1A0E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea{font-family:inherit;font-size:16px;user-select:text;-webkit-user-select:text;outline:none;border:none;background:none;color:var(--txt)}
button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit;padding:0;cursor:pointer}
textarea{resize:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#view{position:absolute;inset:0;overflow:hidden;z-index:1}
#appVeil{position:fixed;inset:0;z-index:0;display:none;pointer-events:none;
  background:rgba(255,255,255,.46);backdrop-filter:blur(3px) saturate(115%);-webkit-backdrop-filter:blur(3px) saturate(115%)}
body.has-appbg #appVeil{display:block}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.page.anim{}
@keyframes pageIn{from{opacity:.5;transform:translateX(12px)}to{opacity:1;transform:none}}
.page .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page.with-tab .scroll{padding-bottom:calc(var(--tabh) + var(--safe-b) + 6px)}
.navbar{height:calc(44px + var(--safe-t));padding-top:var(--safe-t);background:var(--nav);display:flex;align-items:center;flex:none;position:relative;z-index:6}
.navbar .nav-btn{width:48px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--txt)}
.navbar .nav-btn:active{opacity:.5}
.navbar .nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.navbar .nav-title .nav-sub{font-size:11px;font-weight:400;color:var(--sub);display:block;margin-top:-2px}
.navbar .nav-right{display:flex;align-items:center;flex:none}
.navbar .nav-right .nav-btn{width:44px}
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:none;
  height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--tab);border-top:.5px solid var(--line)}
#tabbar.show{display:flex}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7A7E83;font-size:10px;position:relative;padding-top:4px}
.dark .tab-item{color:#8B8F94}
.tab-item.active{color:var(--green)}
.tab-item svg{width:26px;height:26px;display:block}
.tab-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:500}
.tab-dot{position:absolute;top:5px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.avatar{width:44px;height:44px;border-radius:6px;flex:none;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:24px;background:#D8D8D8;line-height:1}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:36px;height:36px;border-radius:5px;font-size:19px}
.avatar.lg{width:56px;height:56px;border-radius:8px;font-size:30px}
.avatar.xl{width:66px;height:66px;border-radius:10px;font-size:36px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--card);position:relative}
.row+.row::before{content:'';position:absolute;left:72px;right:0;top:0;height:.5px;background:var(--line2)}
.row:active{background:#E9E9E9}
.dark .row:active{background:#2A2A2A}
.row-main{flex:1;min-width:0}
.row-title{font-size:16.5px;color:var(--txt);display:flex;align-items:center;gap:6px}
.row-title .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-desc{font-size:13px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-time{font-size:11px;color:var(--sub2);flex:none;align-self:flex-start;margin-top:2px}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:500}
.badge.mini{width:9px;height:9px;min-width:0;padding:0;border-radius:50%;align-self:flex-end}
.chev{color:#C7C7CC;flex:none}
.dark .chev{color:#5A5A5A}
.group-head{font-size:13px;color:var(--sub);padding:5px 16px;background:var(--bg)}
.group-body{background:var(--card)}
.alpha-bar{position:absolute;right:2px;top:50%;transform:translateY(-50%);z-index:8;display:flex;flex-direction:column;
  align-items:center;font-size:10px;color:var(--sub);padding:2px 4px;background:rgba(128,128,128,.12);border-radius:8px;gap:1px}
.alpha-bar span{padding:0 2px;line-height:1.15}
.search-wrap{padding:8px 12px;background:var(--bg);flex:none}
.search-box{height:34px;border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 10px;gap:6px;color:var(--sub);font-size:14px}
.dark .search-box{background:#2A2A2A}
.search-box input{flex:1;font-size:15px;color:var(--txt);background:none}
.search-box input::placeholder{color:var(--sub)}
.entry-row{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--card);position:relative}
.entry-row+.entry-row::before{content:'';position:absolute;left:64px;right:0;top:0;height:.5px;background:var(--line2)}
.entry-row:active{background:#E9E9E9}
.entry-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.entry-icon svg{width:22px;height:22px}
.entry-txt{flex:1;font-size:16.5px}
.mcover{height:290px;background:linear-gradient(160deg,#8AB6D6 0%,#5E8FB8 45%,#3E6B96 100%);position:relative;flex:none}
.mcover .cov-img{position:absolute;inset:0;background-size:cover;background-position:center}
.mcover .cov-me{position:absolute;right:14px;bottom:-24px;display:flex;align-items:flex-end;gap:8px;z-index:2}
.mcover .cov-name{color:#fff;font-size:16px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.45);padding-bottom:36px}
.mcover .cov-me .avatar{width:66px;height:66px;border-radius:10px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:34px}
.mfeed{background:var(--card);min-height:50vh;padding:34px 0 20px}
.mpost{display:flex;gap:10px;padding:14px 14px 4px;background:var(--card)}
.mpost+.mpost{border-top:.5px solid var(--line2);padding-top:16px}
.mpost .avatar{width:40px;height:40px;border-radius:4px;font-size:21px}
.mpost-main{flex:1;min-width:0;padding-bottom:10px}
.mpost-name{color:var(--txt2);font-size:15.5px;font-weight:500}
.mpost-text{font-size:15.5px;line-height:1.5;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.mgrid{display:grid;gap:4px;margin-top:8px}
.mgrid.g1{grid-template-columns:1fr;max-width:62%}
.mgrid.g2{grid-template-columns:1fr 1fr;max-width:66%}
.mgrid.g3{grid-template-columns:repeat(3,1fr);max-width:100%}
.mgrid .mi{aspect-ratio:1;background:#E0E0E0;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
.mgrid.g1 .mi{aspect-ratio:4/3;font-size:44px}
.mgrid .mi img{width:100%;height:100%;object-fit:cover;display:block}
.mpost-meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--sub)}
.mpost-meta .vis-tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#B0B0B0;border:.5px solid var(--line);border-radius:4px;padding:1px 5px}
.mpost-meta .del{color:var(--txt2);font-size:13px}
.like-btn{margin-left:auto;display:flex;align-items:center;gap:4px;background:#F2F2F2;border-radius:4px;padding:4px 10px;color:var(--txt2);font-size:13px}
.dark .like-btn{background:#2C2C2C}
.mreact{margin-top:8px;background:#F7F7F7;border-radius:4px;padding:6px 9px;font-size:14px;line-height:1.5}
.dark .mreact{background:#262626}
.mlikes{display:flex;flex-wrap:wrap;gap:2px 6px;color:var(--txt2);font-size:14px;padding-bottom:2px}
.mlikes .who{display:inline-flex;align-items:center;gap:3px}
.mlike-ico{color:var(--txt2);font-size:13px}
.mcmt{padding:3px 0;font-size:14.5px;word-break:break-word}
.mcmt b{color:var(--txt2);font-weight:500}
.mcmt .to{color:var(--sub);font-size:13px;margin:0 2px}
.mreact-sep{height:.5px;background:#E8E8E8;margin:4px 0 3px}
.dark .mreact-sep{background:#333}
.chat-page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.chat-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg);background-attachment:local;padding:10px 0 14px}
.chat-inner{padding:0 10px}
.sys-msg{text-align:center;font-size:12px;color:var(--sub);margin:10px auto;max-width:80%;background:rgba(0,0,0,.05);
  border-radius:4px;padding:3px 10px;width:fit-content}
.dark .sys-msg{background:rgba(255,255,255,.07)}
.time-div{text-align:center;font-size:12px;color:var(--sub2);margin:14px 0 10px}
.crow{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.crow .avatar{width:40px;height:40px;border-radius:5px;font-size:21px;cursor:pointer}
.crow.me{flex-direction:row-reverse}
.bubble{position:relative;max-width:70%;padding:9px 12px;border-radius:var(--radius);
  font-size:var(--fs);line-height:1.45;word-break:break-word;white-space:pre-wrap;
  transform-origin:top;}
@keyframes pop{from{opacity:.3;transform:scale(.96)}to{opacity:1;transform:none}}
.crow.them .bubble{background:var(--bubble-them);color:var(--bubble-them-txt)}
.crow.me .bubble{background:var(--bubble-me);color:var(--bubble-me-txt)}
.tail-on .crow.them .bubble::before{content:'';position:absolute;left:-6px;top:12px;width:0;height:0;border:6px solid transparent;border-right-color:var(--bubble-them);border-left:0}
.tail-on .crow.me .bubble::before{content:'';position:absolute;right:-6px;top:12px;width:0;height:0;border:6px solid transparent;border-left-color:var(--bubble-me);border-right:0}
.bubble.img{padding:0;background:transparent!important;overflow:hidden;border-radius:4px;max-width:62%}
.bubble.img img{display:block;max-width:100%;width:190px;border-radius:4px;height:auto}
.bubble.long{max-width:84%}
.sender-name{font-size:11px;color:var(--sub);margin-bottom:3px;padding-left:2px}
.crow .msgcol{display:flex;flex-direction:column;max-width:78%}
.crow.me .msgcol{align-items:flex-end}
.sticker{width:126px;height:126px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.10);font-size:44px;line-height:1}
.sticker span{font-size:12px;color:#5a5a5a}
.dark .sticker{background:#2C2C2E}
.dark .sticker span{color:#bbb}
.voice-row{display:flex;align-items:center;gap:8px;min-width:86px;cursor:pointer}
.voice-bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.voice-bars i{width:3px;background:currentColor;border-radius:1px;opacity:.75}
.voice-txt{font-size:12px;color:var(--sub2)}
.aff-bar{height:8px;border-radius:4px;background:#EFEFEF;overflow:hidden;margin-top:6px}
.dark .aff-bar{background:#333}
.aff-bar i{display:block;height:100%;background:linear-gradient(90deg,#FFB3C1,#FF6B81);border-radius:4px;transition:width .3s}
.member-chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.bubble.voice{display:flex;align-items:center;gap:6px;min-width:70px}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:#B9B9B9;animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-input{flex:none;background:var(--tab);border-top:.5px solid var(--line);padding:7px 8px calc(7px + var(--safe-b));
  display:flex;align-items:flex-end;gap:6px;position:relative;z-index:3}
.chat-input .ibtn{width:32px;height:34px;display:flex;align-items:center;justify-content:center;color:#4A4A4A;flex:none}
.dark .chat-input .ibtn{color:#B0B0B0}
.chat-input .ibtn:active{opacity:.5}
.chat-input textarea{flex:1;min-height:36px;max-height:96px;background:#fff;border-radius:5px;padding:7px 9px;
  font-size:16px;line-height:1.35;color:var(--txt);border:.5px solid #E0E0E0;transition:height .1s}
.dark .chat-input textarea{background:#2A2A2A;border-color:#3A3A3A}
.send-btn{background:var(--green);color:#fff;font-size:14px;height:32px;padding:0 12px;border-radius:4px;flex:none;margin-bottom:2px}
.send-btn:active{background:var(--green-d)}
.send-btn:disabled{opacity:.45}
.panel{flex:none;height:0;overflow:hidden;background:var(--tab);border-top:.5px solid transparent}
.panel.open{height:216px;border-top-color:var(--line)}
.panel-inner{padding:8px 10px;height:216px;overflow-y:auto}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid span{font-size:26px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.emoji-grid span:active{background:rgba(0,0,0,.06)}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:8px 4px}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.plus-item .pi{width:56px;height:56px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:#555;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dark .plus-item .pi{background:#2C2C2C;color:#CCC}
.me-head{background:var(--card);padding:26px 20px 20px;display:flex;align-items:center;gap:16px;margin-bottom:9px}
.me-head .avatar{width:64px;height:64px;border-radius:8px;font-size:34px}
.me-name{font-size:21px;font-weight:600;letter-spacing:.3px}
.me-id{font-size:14px;color:var(--sub);margin-top:6px}
.me-list{background:var(--card);margin-bottom:9px;overflow:hidden}
.me-row{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative}
.me-row+.me-row::before{content:'';position:absolute;left:58px;right:0;top:0;height:.5px;background:var(--line2)}
.me-row:active{background:#EFEFEF}
.dark .me-row:active{background:#2A2A2A}
.me-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.me-icon svg{width:18px;height:18px}
.me-row .t{flex:1;font-size:16.5px}
.me-row .v{font-size:14px;color:var(--sub)}
.form-block{background:var(--card);margin-bottom:9px}
.form-item{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;min-height:50px}
.form-item+.form-item::before{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--line2)}
.form-item .k{font-size:16px;flex:none;width:78px;color:var(--txt)}
.form-item .k.wide{width:auto}
.form-item input[type=text],.form-item input[type=password],.form-item input[type=url]{flex:1;font-size:15.5px;text-align:right}
.form-item input::placeholder{color:#C4C4C4}
.form-item .v{flex:1;text-align:right;color:var(--sub);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-item.col{flex-direction:column;align-items:stretch;gap:6px}
.form-item.col .k{width:auto;font-size:14px;color:var(--sub)}
.form-item textarea{width:100%;min-height:64px;font-size:15px;line-height:1.5;background:transparent}
.form-item .hint{font-size:12px;color:#B0B0B0;line-height:1.4}
.switch{width:48px;height:29px;border-radius:15px;background:#E5E5E5;position:relative;flex:none;}
.switch.on{background:var(--green)}
.switch i{position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on i{left:21px}
.btn-primary{display:block;width:calc(100% - 32px);margin:22px 16px;height:46px;border-radius:8px;background:var(--green);
  color:#fff;font-size:17px;font-weight:500;text-align:center;line-height:46px}
.btn-primary:active{background:var(--green-d)}
.btn-primary.ghost{background:transparent;color:var(--txt);border:.5px solid var(--line)}
.btn-mini{background:var(--green);color:#fff;font-size:13px;padding:5px 12px;border-radius:4px}
.btn-mini.gray{background:#F0F0F0;color:#666}
.dark .btn-mini.gray{background:#333;color:#AAA}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 6px}
.tag{font-size:12px;padding:3px 9px;border-radius:11px;background:#F0F0F0;color:#666}
.dark .tag{background:#2C2C2C;color:#BBB}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.chip{padding:6px 12px;border-radius:15px;background:#F2F2F2;font-size:13.5px;color:#555;border:1px solid transparent}
.dark .chip{background:#2C2C2C;color:#CCC}
.chip.on{background:rgba(7,193,96,.12);color:var(--green);border-color:rgba(7,193,96,.4)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0}
.sw{width:44px;height:44px;border-radius:8px;border:2px solid transparent;position:relative;display:flex;align-items:center;justify-content:center}
.sw.on{border-color:var(--green)}
.sw.on::after{content:'✓';color:#fff;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.bg-sec{font-size:13px;color:var(--sub);padding:12px 16px 2px}
.has-appbg .page{background:transparent}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px}
.bg-cell{aspect-ratio:9/16;border-radius:8px;border:2px solid transparent;position:relative;overflow:hidden;background-size:cover;background-position:center}
.bg-cell.on{border-color:var(--green)}
.bg-cell .lbl{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;background:rgba(0,0,0,.32);padding:3px 0;text-align:center}
.bg-cell .bubble-demo{position:absolute;left:8px;right:8px;top:12px;display:flex;flex-direction:column;gap:5px}
.bg-cell .bubble-demo i{display:block;height:10px;border-radius:3px;background:rgba(255,255,255,.92);width:60%}
.bg-cell .bubble-demo i.me{margin-left:auto;background:var(--bubble-me);width:52%}
.range-row{display:flex;align-items:center;gap:12px;padding:12px 16px}
.range-row input[type=range]{flex:1;accent-color:var(--green)}
.range-row .rv{font-size:13px;color:var(--sub);width:46px;text-align:right}
#layer{position:fixed;inset:0;z-index:100;pointer-events:none}
#layer>*{pointer-events:auto}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.mask.center{align-items:center;padding:24px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--bg);border-radius:14px 14px 0 0;padding-bottom:var(--safe-b);
  overflow:hidden;max-height:82vh;overflow-y:auto}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-title{text-align:center;font-size:13px;color:var(--sub);padding:14px 0 4px}
.sheet-item{padding:15px 18px;font-size:17px;text-align:center;background:var(--card);color:var(--txt)}
.sheet-item+.sheet-item{border-top:.5px solid var(--line2)}
.sheet-item:active{background:#EFEFEF}
.sheet-item.danger{color:var(--red)}
.sheet-item.cancel{margin-top:8px;font-weight:600}
.dialog{width:100%;max-width:320px;background:var(--card);border-radius:12px;overflow:hidden}
.dialog .dt{font-size:17px;font-weight:600;text-align:center;padding:20px 18px 8px}
.dialog .db{font-size:14px;color:var(--sub);text-align:center;padding:0 18px 18px;line-height:1.5}
.dialog .di{display:flex;border-top:.5px solid var(--line)}
.dialog .di button{flex:1;padding:14px 0;font-size:17px;color:var(--txt2)}
.dialog .di button+button{border-left:.5px solid var(--line)}
.dialog .di button.danger{color:var(--red)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;
  padding:12px 20px;border-radius:8px;font-size:15px;max-width:70vw;text-align:center;line-height:1.4;z-index:200}
.toast.bottom{top:auto;bottom:100px;transform:translate(-50%,0)}
.cmt-bar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);border-top:.5px solid var(--line);
  padding:8px 10px calc(8px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;z-index:120}
.cmt-bar textarea{flex:1;background:#fff;border-radius:5px;padding:8px 10px;min-height:36px;max-height:90px;font-size:15px;border:.5px solid #E0E0E0}
.dark .cmt-bar textarea{background:#2A2A2A;border-color:#3A3A3A}
.av-picker{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.av-opt{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;border:1.5px solid transparent}
.av-opt.on{border-color:var(--green)}
.av-add{width:52px;height:52px;border-radius:8px;border:1px dashed #CCC;color:#999;display:flex;align-items:center;justify-content:center;font-size:24px}
.pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2)}
.pick{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--card);min-width:0}
.pick-grid.one{grid-template-columns:1fr}
.pick .btn-mini{flex:none}
.pick .avatar{width:36px;height:36px;font-size:19px;border-radius:5px}
.pick .n{flex:1;min-width:0;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{width:20px;height:20px;border-radius:50%;border:1px solid #CCC;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex:none}
.check.on{background:var(--green);border-color:var(--green)}
.empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.empty .big{font-size:44px;display:block;margin-bottom:8px}
.foot-tip{text-align:center;font-size:12px;color:#B8B8B8;padding:18px 24px 30px;line-height:1.6}
.mt8{margin-top:8px}.mt16{margin-top:16px}
.hidden{display:none!important}

/* ========== 壁纸模式（整体背景为图片时） ========== */
body.has-appbg .page{background:transparent}
body.has-appbg .navbar{background:rgba(237,237,237,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.has-appbg #tabbar{background:rgba(247,247,247,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.has-appbg .row,
body.has-appbg .entry-row,
body.has-appbg .me-row,
body.has-appbg .me-list,
body.has-appbg .me-head,
body.has-appbg .form-block,
body.has-appbg .mpost,
body.has-appbg .group-body,
body.has-appbg .pick,
body.has-appbg .dialog,
body.has-appbg .sheet{background:rgba(255,255,255,.62)}
body.has-appbg .row:active,
body.has-appbg .entry-row:active,
body.has-appbg .me-row:active{background:rgba(255,255,255,.85)}
body.has-appbg .search-wrap{background:transparent}
body.has-appbg .search-box{background:rgba(255,255,255,.7);border-radius:16px}
body.has-appbg .foot-tip{color:rgba(0,0,0,.35)}
body.has-appbg .empty{color:rgba(0,0,0,.45)}
body.has-appbg .mfeed{background:transparent}
body.has-appbg .mcover{opacity:1}
body.dark.has-appbg #appVeil{background:rgba(0,0,0,.45)}
body.dark.has-appbg .row,
body.dark.has-appbg .entry-row,
body.dark.has-appbg .me-row,
body.dark.has-appbg .me-list,
body.dark.has-appbg .me-head,
body.dark.has-appbg .form-block,
body.dark.has-appbg .mpost,
body.dark.has-appbg .group-body,
body.dark.has-appbg .pick{background:rgba(30,30,32,.62)}

/* ========== 聊天页壁纸模式（QQ 风） ========== */
.chat-wall .navbar{background:rgba(237,237,237,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chat-wall .crow.them .bubble{background:rgba(255,255,255,.80);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chat-wall .crow.me .bubble{background:rgba(149,236,105,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chat-wall .time-div{background:rgba(0,0,0,.16);color:#fff;display:block;width:fit-content;margin:14px auto 10px;padding:2px 10px;border-radius:10px}
.chat-wall .sys-msg{background:rgba(0,0,0,.20);color:#fff}
.chat-wall .chat-input{background:rgba(247,247,247,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chat-wall .panel{background:rgba(247,247,247,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chat-wall .bubble.img,
.chat-wall .bubble.img img{backdrop-filter:none}
body.dark .chat-wall .crow.them .bubble{background:rgba(44,44,46,.82)}

/* ===== V2 视觉优化（浅底 + 白卡 + 淡蓝紫点缀） ===== */
:root{
  --v2-bg:#F4F5F9;
  --v2-card:#FFFFFF;
  --v2-line:rgba(0,0,0,.045);
  --v2-accent:#7C8CF8;
  --v2-radius:16px;
}
body{ background:var(--v2-bg); }
#app{ background:var(--v2-bg); }
.page{ background:var(--v2-bg); }

/* 导航栏：白底毛玻璃 */
.navbar{ background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:.5px solid var(--v2-line); }
.navbar .nav-title{ font-size:17px; font-weight:600; }

/* 搜索框：胶囊 */
.search-wrap{ padding:10px 14px; background:transparent; }
.search-box{ height:38px; border-radius:19px; background:#EEF0F6; padding:0 14px; }
.search-box input::placeholder{ color:#9AA0AE; }

/* 列表：白卡 + 圆角 + 间距 */
.scroll > .row,
.scroll > .entry-row,
.scroll > .me-list,
.scroll > .form-block{ border-radius:var(--v2-radius); margin:8px 12px; overflow:hidden; background:var(--v2-card); box-shadow:0 1px 2px rgba(16,24,40,.04); }
.scroll > .row + .row::before,
.scroll > .entry-row + .entry-row::before{ display:none; }
.row{ padding:12px 14px; }
.row .avatar{ width:46px; height:46px; border-radius:12px; font-size:23px; }
.row-title{ font-size:16.5px; font-weight:500; }
.row-desc{ font-size:13px; color:#9AA0AE; }
.row-time{ font-size:11.5px; color:#B4B9C4; }
.badge{ background:#FA5151; border-radius:10px; box-shadow:0 1px 3px rgba(250,81,81,.35); }

/* 分组标题 */
.group-head,.bg-sec{ padding:14px 22px 6px; color:#9AA0AE; font-size:12.5px; letter-spacing:.3px; background:transparent; }
.group-body{ background:transparent; }
.group-body .row{ border-radius:var(--v2-radius); margin:8px 12px; box-shadow:0 1px 2px rgba(16,24,40,.04); }

/* 底部 Tab：白底 + 选中高亮 */
#tabbar{ background:rgba(255,255,255,.94); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:.5px solid var(--v2-line); box-shadow:0 -2px 12px rgba(16,24,40,.05); }
.tab-item{ color:#9BA1AE; font-size:10.5px; }
.tab-item.active{ color:var(--green); }
.tab-item.active svg{ transform:translateY(-1px) scale(1.06); }

/* 我的页 / 设置页卡片 */
.me-head{ border-radius:var(--v2-radius); margin:10px 12px 12px; padding:20px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
.me-row{ padding:14px 16px; }
.me-icon{ border-radius:9px; }

/* 聊天：气泡更圆、头像圆角更大 */
.crow .avatar{ border-radius:50%; }
.bubble{ border-radius:16px; padding:10px 14px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
.crow.them .bubble{ border-top-left-radius:6px; }
.crow.me .bubble{ border-top-right-radius:6px; }
.tail-on .crow.them .bubble::before,
.tail-on .crow.me .bubble::before{ display:none; }
.chat-input{ background:rgba(255,255,255,.95); backdrop-filter:blur(14px); border-top:.5px solid var(--v2-line); }
.chat-input textarea{ border-radius:18px; border-color:transparent; background:#F1F3F8; }
.chat-body{ background:var(--v2-bg); }

/* 聊天气泡配色更柔 */
:root{ --bubble-me:#95EC69; }

/* 朋友圈卡片 */
.mpost{ border-radius:var(--v2-radius); margin:10px 12px; padding:14px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
.mpost + .mpost{ border-top:none; }

/* 按钮 */
.btn-primary{ border-radius:14px; background:var(--green); box-shadow:0 4px 12px rgba(7,193,96,.22); }
.btn-primary.ghost{ background:#fff; box-shadow:0 1px 2px rgba(16,24,40,.05); }

/* 深色模式 */
body.dark{ --v2-bg:#141518; --v2-card:#1F2126; --v2-line:rgba(255,255,255,.06); }
body.dark .navbar{ background:rgba(20,21,24,.9); }
body.dark .search-box{ background:#26282E; }
body.dark #tabbar{ background:rgba(20,21,24,.94); }
body.dark .chat-input{ background:rgba(20,21,24,.95); }
body.dark .chat-input textarea{ background:#26282E; }

/* 壁纸模式下仍然保留毛玻璃效果 */
body.has-appbg .scroll > .row,
body.has-appbg .scroll > .me-list,
body.has-appbg .scroll > .form-block,
body.has-appbg .mpost{ background:rgba(255,255,255,.62); box-shadow:0 1px 3px rgba(16,24,40,.06); }
body.dark.has-appbg .scroll > .row,
body.dark.has-appbg .scroll > .me-list,
body.dark.has-appbg .scroll > .form-block,
body.dark.has-appbg .mpost{ background:rgba(30,32,38,.62); }

/* 剧情状态栏 */
.story-bar{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;background:rgba(255,255,255,.92);border-bottom:.5px solid var(--line2);flex:none}
body.dark .story-bar{background:rgba(26,26,26,.92)}
.story-chip{font-size:12px;padding:3px 10px;border-radius:12px;background:rgba(124,92,252,.10);color:#6D4AE0;white-space:nowrap}
.story-chip b{font-weight:600}
body.dark .story-chip{background:rgba(124,92,252,.20);color:#B9A6FF}

/* 红包 / 转账 卡片 */
.pay-card{width:220px;max-width:220px;padding:0;overflow:hidden;border-radius:10px;color:#fff;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pay-card.red{background:linear-gradient(160deg,#F76A5B,#E8503F)}
.pay-card.blue{background:linear-gradient(160deg,#FF9F45,#FA7A2B)}
.pay-card.opened{opacity:.72}
.pay-card .pay-head{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.pay-card .pay-ico{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px}
.pay-card .pay-title{font-size:15px;font-weight:600;line-height:1.2}
.pay-card .pay-note{padding:0 12px 8px;font-size:12px;opacity:.9}
.pay-card .pay-amount{padding:2px 12px 10px;font-size:26px;font-weight:700;letter-spacing:.5px}
.pay-card .pay-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:rgba(0,0,0,.10);font-size:11.5px;opacity:.95}
.pay-card .pay-amt{font-weight:600}

/* 场景条 */
.scene-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);
  border-bottom:.5px solid var(--line2);flex:none;font-size:12px;overflow:hidden;cursor:pointer}
body.dark .scene-bar{background:rgba(26,26,26,.92)}
.scene-tag{flex:none;padding:3px 10px;border-radius:12px;background:rgba(7,193,96,.12);color:#07A858;font-weight:500}
body.dark .scene-tag{background:rgba(7,193,96,.2);color:#7EE0AC}
.scene-hint{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 旁白 / 指令 */
.narration-line{margin:12px 22px;text-align:center;font-size:13.5px;line-height:1.7;color:#6b6b6b;
  background:rgba(255,255,255,.55);border-left:3px solid rgba(124,92,252,.5);border-radius:8px;padding:9px 12px}
body.dark .narration-line{color:#bbb;background:rgba(255,255,255,.07)}
.ooc-line{margin:8px 16px 8px auto;max-width:82%;text-align:right;font-size:12.5px;color:#8a6d3b;
  background:rgba(255,215,120,.22);border-radius:8px;padding:7px 10px}
.mode-btn{font-size:17px}

/* 赴约叙事页 */
.date-page{position:absolute;inset:0;display:flex;flex-direction:column;background:#FBF7F1;color:#2b2b2b}
body.dark .date-page{background:#141518;color:#e6e6e6}
.date-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:14px;
  border-bottom:.5px solid rgba(0,0,0,.06)}
.date-head .date-name{font-weight:600}
.date-head .date-time{font-size:12px;color:#9a9a9a}
.date-body{flex:1;overflow-y:auto;padding:18px 20px 90px;font-size:16px;line-height:1.95;letter-spacing:.2px}
.date-body p{margin:0 0 18px}
.date-body .writing{color:#b0a08c;font-size:13px}
.date-foot{position:absolute;left:0;right:0;bottom:52px;display:flex;gap:8px;align-items:center;padding:8px 14px;
  background:linear-gradient(to top,rgba(251,247,241,.95),rgba(251,247,241,0))}
.date-tag{font-size:11.5px;padding:3px 9px;border-radius:11px;background:rgba(124,92,252,.12);color:#6D4AE0}
.date-tag.gray{background:rgba(0,0,0,.06);color:#777}
.date-end{margin-left:auto;font-size:12.5px;padding:6px 12px;border-radius:14px;background:#8a6d3b;color:#fff;border:0}
.date-input{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 12px;background:rgba(255,255,255,.96);
  border-top:.5px solid rgba(0,0,0,.06)}
.date-input input{flex:1;border:0;background:#F2F2F2;border-radius:16px;padding:9px 12px;font-size:14px;outline:none}
.date-input button{border:0;background:#07C160;color:#fff;border-radius:16px;padding:0 14px;font-size:14px}

/* ===== V3 QQ 质感 ===== */
:root{
  --qq-blue:#12B7F5;
  --qq-bg:#F2F3F5;
  --qq-card:#FFFFFF;
  --qq-radius:14px;
}
body, #app, .page{ background:var(--qq-bg); }

/* 顶部导航：干净白 + 细阴影 */
.navbar{ background:rgba(255,255,255,.96); box-shadow:0 1px 0 rgba(0,0,0,.04); border-bottom:none; }
.navbar .nav-title{ font-size:17px; font-weight:600; letter-spacing:.2px; }

/* 搜索：QQ 胶囊 */
.search-box{ height:36px; border-radius:18px; background:#F0F1F4; border:.5px solid rgba(0,0,0,.03); }
.search-box input{ font-size:14px; }

/* 列表：圆形头像 + 更大行高 */
.row{ padding:11px 14px; }
.row .avatar{ border-radius:50% !important; width:48px; height:48px; }
.row-title{ font-size:16.5px; font-weight:500; }
.row-desc{ font-size:13px; color:#8E9099; }
.row-time{ font-size:11.5px; color:#B7BAC2; }
.badge{ min-width:19px; height:19px; line-height:19px; border-radius:10px; background:#FA5151; font-size:11.5px; }

/* 底部 Tab：QQ 蓝选中 + 大图标 */
#tabbar{ background:rgba(255,255,255,.97); box-shadow:0 -1px 0 rgba(0,0,0,.04); }
.tab-item{ font-size:10.5px; color:#9AA0AC; }
.tab-item svg{ width:26px; height:26px; }
.tab-item.active{ color:var(--qq-blue); font-weight:600; }
.tab-item.active svg{ transform:translateY(-1px) scale(1.05); }

/* 聊天：圆形头像 + 气泡更圆 */
.crow .avatar{ border-radius:50% !important; }
.bubble{ border-radius:18px; }
.crow.them .bubble{ border-top-left-radius:4px; }
.crow.me .bubble{ border-top-right-radius:4px; }
.chat-input{ background:rgba(255,255,255,.98); box-shadow:0 -1px 0 rgba(0,0,0,.04); }
.chat-input textarea{ background:#F0F1F4; border-radius:18px; }
.chat-input .mode-btn{ background:#F0F1F4; border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }

/* 卡片：更轻的阴影 */
.scroll > .me-list, .scroll > .form-block, .mpost, .me-head{
  border-radius:var(--qq-radius); box-shadow:0 1px 2px rgba(16,24,40,.05);
}

/* 弹层：QQ 风格圆角 */
.dialog{ border-radius:16px; }
.sheet{ border-radius:16px 16px 0 0; }
.sheet-item{ padding:15px 16px; font-size:16px; }

/* 主色按钮 */
.btn-primary{ border-radius:12px; }

/* 语音通话页 */
.call-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(170deg,#22303c,#38495c 60%,#22303c);color:#fff;padding:24px 20px 30px}
.call-top{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.call-name{font-size:20px;font-weight:600;letter-spacing:.5px}
.call-status{font-size:13px;color:rgba(255,255,255,.7)}
.call-center{margin:26px 0 10px}
.call-center .avatar{width:104px;height:104px;border-radius:50%;font-size:52px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.call-lines{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 4px;justify-content:flex-end}
.call-line{max-width:78%;font-size:14px;line-height:1.5;padding:8px 12px;border-radius:14px;
  background:rgba(255,255,255,.14);align-self:flex-start}
.call-line.me{background:rgba(149,236,105,.85);color:#183a08;align-self:flex-end}
.call-input{display:flex;gap:8px;width:100%;margin-bottom:12px}
.call-input input{flex:1;border:0;border-radius:18px;padding:10px 14px;font-size:14px;background:rgba(255,255,255,.16);color:#fff;outline:none}
.call-input input::placeholder{color:rgba(255,255,255,.5)}
.call-input button{border:0;border-radius:18px;padding:0 16px;background:rgba(255,255,255,.9);color:#22303c;font-size:14px}
.call-actions{display:flex;gap:24px}
.call-end{width:64px;height:64px;border-radius:50%;border:0;background:#F4544B;color:#fff;font-size:15px}
body.dark .call-page{background:linear-gradient(170deg,#101418,#1d2730 60%,#101418)}

/* ===== 简洁风微调 ===== */
.scroll > .row, .scroll > .me-list, .scroll > .form-block, .mpost{ box-shadow:none; border:.5px solid rgba(0,0,0,.035); }
body.dark .scroll > .row, body.dark .scroll > .me-list, body.dark .scroll > .form-block, body.dark .mpost{ border-color:rgba(255,255,255,.05); }
.navbar{ box-shadow:none; border-bottom:.5px solid rgba(0,0,0,.04); }
#tabbar{ box-shadow:none; border-top:.5px solid rgba(0,0,0,.05); }
.chat-input{ box-shadow:none; border-top:.5px solid rgba(0,0,0,.05); }
.bubble{ box-shadow:none; }
.btn-primary{ box-shadow:none; }

/* 通话页（纯语音） */
.call-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(170deg,#22303c,#38495c 60%,#22303c);color:#fff;padding:24px 20px 34px}
.call-top{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.call-name{font-size:20px;font-weight:600;letter-spacing:.5px}
.call-status{font-size:13px;color:rgba(255,255,255,.7)}
.call-center{margin:auto 0 6px;display:flex;justify-content:center}
.call-center .avatar{width:120px;height:120px;border-radius:50%;font-size:58px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.call-hint{min-height:22px;font-size:14px;color:rgba(255,255,255,.72);margin:14px 0 6px;text-align:center}
.call-hint.listening{color:#95EC69}
.call-hint.speaking{color:#7cc6ff}
.call-wave{display:flex;gap:5px;align-items:flex-end;height:26px;margin-bottom:26px}
.call-wave i{display:block;width:5px;border-radius:3px;background:rgba(255,255,255,.5);animation:callwave 1s infinite ease-in-out}
.call-wave i:nth-child(1){height:8px;animation-delay:0s}
.call-wave i:nth-child(2){height:16px;animation-delay:.15s}
.call-wave i:nth-child(3){height:24px;animation-delay:.3s}
.call-wave i:nth-child(4){height:14px;animation-delay:.45s}
.call-wave i:nth-child(5){height:9px;animation-delay:.6s}
@keyframes callwave{0%,100%{transform:scaleY(.5);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.call-actions{display:flex;gap:30px;align-items:center;margin-bottom:14px}
.call-mic{width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px}
.call-end{width:64px;height:64px;border-radius:50%;border:0;background:#F4544B;color:#fff;font-size:15px}
.call-tip{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:8px}
body.dark .call-page{background:linear-gradient(170deg,#101418,#1d2730 60%,#101418)}

@keyframes spin{to{transform:rotate(360deg)}}

<script>
/* ==== idb.js ==== */
'use strict';
/* ==================== 图片仓库（IndexedDB） ==================== */
var MEM = {};            // key -> dataURL（内存缓存，渲染用）
var IDB_OK = false;
var _db = null;

function idbOpen(){
  return new Promise(function(res, rej){
    try{
      var r = indexedDB.open('wxclone_img', 1);
      r.onupgradeneeded = function(e){ e.target.result.createObjectStore('img'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error || new Error('idb open fail')); };
      r.onblocked = function(){ rej(new Error('idb blocked')); };
    }catch(e){ rej(e); }
  });
}
function idbTx(mode){ return _db.transaction('img', mode).objectStore('img'); }
function idbPut(key, val){
  return new Promise(function(res, rej){
    try{
      var st = idbTx('readwrite');
      st.put(val, key);
      st.transaction.oncomplete = function(){ res(true); };
      st.transaction.onerror = function(){ rej(st.transaction.error || new Error('idb put fail')); };
      st.transaction.onabort = function(){ rej(new Error('idb put abort')); };
    }catch(e){ rej(e); }
  });
}
function idbGet(key){
  return new Promise(function(res){
    try{
      var st = idbTx('readonly');
      var rq = st.get(key);
      rq.onsuccess = function(){ res(rq.result || null); };
      rq.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbDel(key){
  return new Promise(function(res){
    try{ var st = idbTx('readwrite'); st.delete(key); st.transaction.oncomplete=function(){res(true);}; }
    catch(e){ res(false); }
  });
}
async function idbInit(){
  try{
    _db = await idbOpen();
    IDB_OK = true;
  }catch(e){
    IDB_OK = false;
  }
  return IDB_OK;
}
/* 生成图片键（采样哈希，便宜且稳定） */
function imgKeyFor(str){
  var h = 2166136261, step = Math.max(1, Math.floor(str.length/4096));
  for(var i=0;i<str.length;i+=step){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return 'k' + (h>>>0).toString(36) + '_' + str.length.toString(36);
}
/* 把 dataURL 存进 IDB，返回 idb:key（失败则原样返回） */
async function storeImg(dataURL){
  if(!dataURL || typeof dataURL!=='string' || dataURL.indexOf('data:')!==0) return dataURL;
  if(!IDB_OK) return dataURL;
  var key = imgKeyFor(dataURL);
  if(!MEM[key]){
    MEM[key] = dataURL;
    try{ await idbPut(key, dataURL); }catch(e){ return dataURL; }
  }
  return 'idb:'+key;
}
/* 渲染时取真实地址 */
function imgSrc(v){
  if(typeof v !== 'string') return '';
  if(v.indexOf('idb:')===0){
    var k = v.slice(4);
    if(MEM[k]) return MEM[k];
    if(IDB_OK){ idbGet(k).then(function(val){ if(val){ MEM[k]=val; if(window.__onImgLoaded) window.__onImgLoaded(k); } }); }
    return '';
  }
  return v;
}
function isImgRef(v){ return typeof v==='string' && v.indexOf('idb:')===0; }
/* 遍历对象里的所有字符串 */
function walkStrings(obj, fn){
  if(!obj) return;
  if(Array.isArray(obj)){ for(var i=0;i<obj.length;i++) walkStrings(obj[i], fn); return; }
  if(typeof obj==='object'){ for(var k in obj){ if(Object.prototype.hasOwnProperty.call(obj,k)) walkStrings(obj[k], fn); } return; }
  if(typeof obj==='string') fn(obj);
}
/* 启动：把状态里的 idb: 键解析回内存缓存 */
async function resolveStateImages(state){
  var keys = {};
  walkStrings(state, function(s){ if(isImgRef(s)) keys[s.slice(4)] = 1; });
  var list = Object.keys(keys);
  if(!list.length) return;
  await Promise.all(list.map(async function(k){
    if(MEM[k]) return;
    var v = await idbGet(k);
    if(v) MEM[k] = v;
  }));
}
/* 把状态里内联的 dataURL 迁移进 IDB（原地改成 idb:key，嵌套任意层级） */
async function migrateInlineImages(state){
  if(!IDB_OK || !state) return 0;
  var tasks = [], n = 0;
  function walk(node){
    if(!node || typeof node!=='object') return;
    if(Array.isArray(node)){ for(var i=0;i<node.length;i++) walk(node[i]); return; }
    for(var k in node){
      if(!Object.prototype.hasOwnProperty.call(node,k)) continue;
      var v = node[k];
      if(typeof v==='string'){
        if(v.indexOf('data:')===0 && v.length>4000){
          (function(obj,key,val){
            tasks.push(storeImg(val).then(function(nv){ if(isImgRef(nv)){ obj[key]=nv; n++; } }).catch(function(){}));
          })(node,k,v);
        }
      }else if(v && typeof v==='object'){
        walk(v);
      }
    }
  }
  walk(state);
  await Promise.all(tasks);
  return n;
}

/* ---------- 全量状态（文字数据）也放 IDB，突破 localStorage 10MB 上限 ---------- */
var STATE_KEY = '__state_v2__';
function idbSetState(json){
  return new Promise(function(res){
    if(!IDB_OK){ res(false); return; }
    try{
      var st = idbTx('readwrite');
      st.put(json, STATE_KEY);
      st.transaction.oncomplete = function(){ res(true); };
      st.transaction.onerror = function(){ res(false); };
      st.transaction.onabort = function(){ res(false); };
    }catch(e){ res(false); }
  });
}
function idbGetState(){
  return new Promise(function(res){
    if(!IDB_OK){ res(null); return; }
    try{
      var st = idbTx('readonly');
      var rq = st.get(STATE_KEY);
      rq.onsuccess = function(){ res(rq.result || null); };
      rq.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
/* 真实可用配额 */
async function storageQuota(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      var e = await navigator.storage.estimate();
      return { usage: e.usage||0, quota: e.quota||0 };
    }
  }catch(err){}
  return { usage:0, quota:0 };
}

const DBKEY = 'wxclone.v1';
const H = 3600e3, MIN = 60e3, DAY = 86400e3;

function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad2(n){ return (n<10?'0':'')+n; }
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function sameDay(a,b){ return startOfDay(a)===startOfDay(b); }

function fmtListTime(ts){
  if(!ts) return '';
  const now=Date.now();
  if(sameDay(ts,now)){ const d=new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  const d=new Date(ts);
  if(sameDay(ts,now-DAY)) return '昨天';
  const diff=(startOfDay(now)-startOfDay(ts))/DAY;
  if(diff<7) return '周'+'日一二三四五六'[d.getDay()];
  if(d.getFullYear()===new Date(now).getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
}
function fmtMsgTime(ts){
  const now=Date.now(), d=new Date(ts);
  const hm=pad2(d.getHours())+':'+pad2(d.getMinutes());
  if(sameDay(ts,now)) return hm;
  if(sameDay(ts,now-DAY)) return '昨天 '+hm;
  if(d.getFullYear()===new Date(now).getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function fmtMomentTime(ts){
  const dt=Date.now()-ts;
  if(dt<MIN) return '刚刚';
  if(dt<H) return Math.floor(dt/MIN)+'分钟前';
  if(sameDay(ts,Date.now())) return Math.floor(dt/H)+'小时前';
  if(dt<2*DAY) return '昨天';
  if(dt<7*DAY) return Math.floor(dt/DAY)+'天前';
  const d=new Date(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}

function normalize(s){

    c.style = STYLES[c.style]? c.style : 'lively';
    c.tags = Array.isArray(c.tags)? c.tags : [];
    c.wxid = c.wxid || ('wxid_'+Math.random().toString(36).slice(2,10));
    if(c.active===undefined) c.active=true;
    if(c.speed===undefined) c.speed=1;
    if(c.emojiRate===undefined) c.emojiRate=.5;
    if(c.longform===undefined) c.longform=false;
    if(c.gender===undefined) c.gender='auto';
    if(!Array.isArray(c.mem)) c.mem=[];
    if(!c.story) c.story={on:false, stats:{}};
    if(!c.scene) c.scene='online';
    if(!c.api) c.api={mode:'inherit'};
    if(!c.freq) c.freq='normal';
    if(c.vision===undefined) c.vision=false;
    if(c.autoWill===undefined) c.autoWill=false;
    if(!c.voice) c.voice=(typeof autoVoice==='function')? autoVoice(c.name, c.persona, c.gender) : 'qingnian';
    if(typeof c.speed!=='number') c.speed=1;
    if(c.affinity===undefined) c.affinity=12;
    if(c.isGroup===undefined) c.isGroup=false;
    if(!Array.isArray(c.members)) c.members=[];
    if(c.script===undefined) c.script='';
  });
  s.chats = s.chats || {};
  Object.keys(s.chats).forEach(k=>{
    const ch=s.chats[k];
    ch.msgs = Array.isArray(ch.msgs)? ch.msgs : [];
    ch.unread = ch.unread||0;
    ch.draft = ch.draft||'';
  });
  // 补全缺失的会话
  s.contacts.forEach(c=>{ if(!s.chats[c.id]) s.chats[c.id]={id:c.id,msgs:[],unread:0,draft:'',bg:null,pinned:false,muted:false,typing:false}; });

  s.settings = Object.assign({bg:{k:'color',v:'#EDEDED'}, bubble:{theme:'green',radius:6,fs:16,tail:true}, dark:false,
    ai:{provider:'local', baseUrl:'https://api.deepseek.com/v1', key:'', model:'deepseek-chat', temp:.85},
    autoPost:true, reactNotify:true}, s.settings||{});
  s.settings.bubble = Object.assign({theme:'green',radius:6,fs:16,tail:true}, s.settings.bubble||{});

  s.meta = Object.assign({createdAt:Date.now(), momentsDot:false}, s.meta||{});
  return s;
}

function load(){
  return new Promise(async function(resolve){
    let parsed = null, raw = null;
    // 1) 优先从 IDB 读全量状态
    try{
      if(typeof idbGetState==='function' && typeof IDB_OK!=='undefined' && IDB_OK){
        const fromIdb = await idbGetState();
        if(fromIdb){ try{ parsed = JSON.parse(fromIdb); }catch(e){ parsed = null; } }
      }
    }catch(e){}
    // 2) 退回 localStorage
    if(!parsed){
      try{ raw = localStorage.getItem(DBKEY); }catch(e){ storageOK = false; }
      if(raw){ try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; } }
    }
    if(!parsed){ S = normalize(seed()); saveNow(); resolve(S); return; }
    S = parsed;
    const done = function(){ S = normalize(S); resolve(S); };
    try{
      if(typeof resolveStateImages==='function'){ resolveStateImages(S).then(done).catch(done); }
      else done();
    }catch(e){ done(); }
  });
}
function saveNow(){
  try{
    var json = JSON.stringify(S);
    if(typeof idbSetState==='function' && typeof IDB_OK!=='undefined' && IDB_OK){
      idbSetState(json);                 // 大仓库：随手机磁盘（几百 MB 起）
      storageOK = true;
      try{ localStorage.setItem(DBKEY, json); }catch(e){}   // 顺手留个副本，满了也无所谓
      return;
    }
    localStorage.setItem(DBKEY, json);
    storageOK = true;
  }catch(e){
    storageOK = false;
    if(window.__onStorageFull) window.__onStorageFull(e);
  }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    if(typeof migrateInlineImages==='function'){
      migrateInlineImages(S).then(saveNow).catch(saveNow);
    }else saveNow();
  }, 150);
}
function resetAll(){
  try{ localStorage.removeItem(DBKEY); }catch(e){}
  S = seed(); saveNow();
}

  return S.chats[cid];

function lastMsg(ch){
  for(let i=ch.msgs.length-1;i>=0;i--){ if(ch.msgs[i].type!=='system') return ch.msgs[i]; }
  return null;
}
function previewOf(ch){
  const m=lastMsg(ch);
  if(!m) return '暂无消息';
  if(m.type==='image') return '[图片]';
  if(m.type==='location') return '[位置]';
  if(m.type==='system') return m.text;
  return m.text;
}
function chatList(){
  return S.contacts.map(c=>({c:c, ch:chatOf(c.id)}))
    .filter(x=>x.ch.msgs.length>0)
    .sort((a,b)=>{
      if(a.ch.pinned !== b.ch.pinned) return a.ch.pinned? -1:1;
      return (lastMsg(b.ch)||{ts:0}).ts - (lastMsg(a.ch)||{ts:0}).ts;
    });
}
function unreadTotal(){ return S.contacts.reduce((n,c)=>n+(chatOf(c.id).unread||0),0); }

function canSee(post, viewer){
  if(post.vis.mode==='private') return post.author===viewer;
  if(post.vis.mode==='all') return true;
  if(post.vis.mode==='include') return post.vis.ids.indexOf(viewer)>=0 || post.author===viewer;

  return true;
}

  return '公开';
}

function pick(arr, avoid){
  if(!arr || !arr.length) return '';
  if(avoid && avoid.length){
    const fresh = arr.filter(x=>avoid.indexOf(x)<0);
    if(fresh.length) arr = fresh;
  }
  return arr[Math.floor(Math.random()*arr.length)];
}
function detectIntent(t){
  if(/^(在吗|在不在|在么|你好|hi|hello|嗨|嘿|早|早上好|中午好|晚上好)/i.test(t)) return 'greet';
  if(/晚安|拜拜|再见|睡了|先这样|回头聊|下线/.test(t)) return 'bye';
  if(/谢谢|多谢|感谢|辛苦/.test(t)) return 'thanks';
  if(/哈哈|233|笑死|太好笑|绷不住|hhh/i.test(t)) return 'laugh';
  if(/累|烦|难过|emo|崩溃|压力|焦虑|想哭|不开心|失眠|撑不住|好惨|害怕|有点怕|好怕|吓/.test(t)) return 'mood_neg';
  if(/开心|高兴|太好了|成功了|通过了|升职|涨薪|中奖|爽/.test(t)) return 'mood_pos';
  if(/吃|饭|饿|外卖|奶茶|咖啡|火锅|甜品|烧烤|夜宵/.test(t)) return 'food';
  if(/加班|上班|老板|领导|开会|工作|项目|需求|裁员|辞职|KPI|周报/.test(t)) return 'work';
  if(/考试|作业|论文|复习|上课|学院|老师|背书|自习|期末/.test(t)) return 'study';
  if(/喜欢你|想你|爱你|心动|在一起|约会|女朋友|男朋友|暧昧/.test(t)) return 'love';
  if(/周末|出去|玩|电影|旅行|约|见面|计划|有空|一起/.test(t)) return 'plan';
  if(/^好的|^好呀|^好啊|^可以|^行|^嗯嗯|^那就|^走吧|^去吧|^听你的|^我去|^没问题|^成交/.test(t)) return 'agree';
  if(/天气|下雨|下雪|热死|冷死|降温|台风|太阳/.test(t)) return 'weather';
  if(/[?？]|吗|呢|怎么|什么|为什么|哪|谁|几点|多少|是不是/.test(t)) return 'question';
  return 'generic';
}
function decorate(style, body, intent){
  const d = DECO[style] || DECO.lively;
  let out = body;
  if(d.short){
    // 高冷：只留短句
    out = out.length > 12 ? out.slice(0, 12).replace(/，.*$/,'') : out;
    if(Math.random()<.5) out = out.replace(/[。，]?$/,'') + '。';
    return out;
  }
  if(Math.random()<.55) out = pick(d.pre) + out;
  if(Math.random()<.75){
    const s = pick(d.suf);
    if(s && !/[。！？～]$/.test(out)) out += s;
  }
  if(d.tail.length && intent!=='bye' && Math.random()<.4) out += ' ' + pick(d.tail);
  return out;
}
function matchInterest(contact, text){
  const list = String(contact.interests||'').split(/[,，、\s]+/).filter(Boolean);
  for(const it of list){ if(text.indexOf(it)>=0) return it; }
  return '';
}

/* 生成本地回复：返回 {texts:[], delay} */
function localReply(contact, text, chat){
  const style = contact.style || 'lively';
  const d = DECO[style] || DECO.lively;
  const intent = detectIntent(text);
  chat.gen = chat.gen || {recent:[]};
  const recent = chat.gen.recent || (chat.gen.recent=[]);
  let body = pick(INTENT[intent] || INTENT.generic, recent);

  // 兴趣命中（偶尔）
  const it = matchInterest(contact, text);
  if(it && Math.random()<.35) body = pick(INTEREST_TALK).replace('{x}', it);

  // 只做一种装饰：口头禅 / 风格后缀 / 表情
  const roll = Math.random();
  if(contact.catch && roll<.14 && intent!=='bye' && body.length<16 && body.indexOf(contact.catch)<0){
    body = body.replace(/[。，]$/,'') + '，' + contact.catch;
  }else{
    body = decorate(style, body, intent);
    const emojiP = (d.emoji!==undefined? d.emoji : .4) * (contact.emojiRate||.5) * 1.6;
    if(Math.random()<emojiP) body += (Math.random()<.6?' ':'') + pick(EMOJI_SET);
  }

  if(contact.mem && contact.mem.length && Math.random()<0.25){
    const m=contact.mem[Math.floor(Math.random()*contact.mem.length)];
    const extra=pick(['对了，你之前说过'+m.f.slice(2)+'，对吧？','我还记得你'+m.f.replace(/^用户/,'')+'。','说起来，'+m.f.replace(/^用户/,'你')+'，别又忘了。']);
    if(extra) body = body + ' ' + extra;
  }
  const texts = [body];
  // 连发第二条
  const multiP = style==='lively'||style==='sunny'||style==='warm' ? .3 : (style==='cold'?.04:.14);
  if(Math.random()<multiP){
    const extra = pick(['哈哈哈','笑死我了','真的假的','所以你准备怎么办','哦对了，你最近还好吗',
      '我先去忙一下，一会儿回你','等下，我想到个事','刚刚差点把杯子摔了','这家外卖我吃过，一般','你这消息我看了三遍'], recent);
    if(extra) texts.push(extra);
  }
  // 记忆：避免连续重复
  texts.forEach(function(t){ recent.push(t); });
  while(recent.length>10) recent.shift();

  const delay = Math.round((420 + Math.random()*650 + text.length*20 + (texts.length-1)*800) * (contact.speed||1));
  return {texts:texts.filter(Boolean), delay:Math.min(delay, 4000)};
}

function localRoleplayReply(contact, text, chat){

    generic: ['「」','「说下去。」','「嗯。」','「这话，我听懂了。」']

  const pool = pools[intent] || pools.generic;
  const line1 = pick(pool.filter(x=>x!=='「」'), recent) || '「嗯。」';
  const useFrag = intent==='question' && frag && frag.length>=2 && frag.length<=8 && Math.random()<.5;
  const l1 = useFrag ? ('「' + frag + '？」') : line1;
  const l2 = Math.random()<.5 ? pick(['「……你先坐。」','「这事不急。」','「我说过的，你记着。」','「别拿这种眼神看我。」'], recent) : '';
  const a1 = pick(acts1, recent);

  let out = '> ' + a1 + '\n' + l1 + '\n';
  if(l2){ out += '> ' + a2 + '\n' + l2 + '\n'; }
  else { out += '> ' + a2; }
  recent.push(a1, l1, l2||'', a2);
  while(recent.length>12) recent.shift();

async function callAPI(sys, history, userText, maxTokens, temperature, cfgOverride, imageDataUrl){
  const cfg = cfgOverride || S.settings.ai;
  const base = (cfg.baseUrl||'').replace(/\/+$/,'');
  const msgs=[{role:'system', content:sys}];
  (history||[]).slice(-16).forEach(function(m){
    if(m.type!=='text' && m.type!=='voice') return;
    msgs.push({role: m.from==='me'? 'user':'assistant', content: m.text||''});
  });
  if(imageDataUrl){
    msgs.push({role:'user', content:[
      {type:'text', text:userText||'（我发了一张图）'},
      {type:'image_url', image_url:{url:imageDataUrl}}
    ]});
  }else{
    msgs.push({role:'user', content:userText});
  }
  const res = await fetch(base+'/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body: JSON.stringify({model:cfg.model, messages:msgs, temperature:temperature, max_tokens:maxTokens})
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  const txt = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
  if(!txt) throw new Error('empty');
  return txt.replace(/^["“]|["”]$/g,'');
}
async function aiReply(contact, history, userText){
  const cfg=S.settings.ai;
  const b=buildSystem(contact, null);
  const t = await callAPI(b.sys, history, userText, b.maxTokens, b.temperature);
  return t;
}
/* 统一入口 */
async function generateReplyFor(contact, text, chat, group, imageDataUrl){
  const cfg = (typeof aiCfgFor==='function')? aiCfgFor(contact) : (S.settings.ai||{});
  if(cfg.mode==='api' && cfg.key){
    try{
      const b = buildSystem(contact, group||null);
      const t = await callAPI(b.sys, chat.msgs, text, b.maxTokens, b.temperature, cfg,
        (cfg.vision && imageDataUrl)? imageDataUrl : null);
      const delay = Math.min(contact.longform? 6000 : 3200, (contact.longform? 900 : 700) + t.length*(contact.longform? 12 : 45));
      return {texts:[t], delay:delay, via:'api'};
    }catch(err){
      const r = contact.longform? localRoleplayReply(contact, text, chat) : localReply(contact, text, chat);
      r.via='local-fallback'; r.err=String(err && err.message || err);
      return r;
    }
  }
  const r = contact.longform? localRoleplayReply(contact, text, chat) : localReply(contact, text, chat);
  if(group){
    // 群里更短一点
    r.texts = r.texts.map(function(t){ return t.length>200? t.slice(0,200)+'…' : t; });
    r.delay = Math.max(700, Math.round((r.delay||1000)*0.8));
  }
  return r;
}
async function generateReply(contact, text, chat, group, imageDataUrl){
  return generateReplyFor(contact, text, chat, group||null, imageDataUrl);
}

function hashStr(s){
  let h=2166136261;

}

function shadeHex(hex, p){
  const n=parseInt(String(hex).replace('#',''),16);
  if(isNaN(n)) return hex;
  let r=(n>>16)&255, g2=(n>>8)&255, b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*(1+p/100))));
  g2=Math.max(0,Math.min(255,Math.round(g2*(1+p/100))));
  b=Math.max(0,Math.min(255,Math.round(b*(1+p/100))));
  return '#'+((1<<24)+(r<<16)+(g2<<8)+b).toString(16).slice(1);
}

function genGroupAvatar(members, size){
  size = size || 256;

  const ms=(members||[]).slice(0,4);
  const imgs=[];
  const load=(src)=> new Promise(function(res){ const im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){res(null);}; im.src=src; });
  const half=size/2;
  const pos=[[0,0],[half,0],[0,half],[half,half]];
  let pending=0, done=0;
  function finish(){
    if(done>=pending){
      try{ return cv.toDataURL('image/png'); }catch(e){ return ''; }
    }
    return '';
  }
  return new Promise(function(resolve){
    pending=ms.length||1;
    if(!ms.length){ g.fillStyle='#BBB'; g.beginPath(); g.arc(half,half,60,0,Math.PI*2); g.fill(); resolve(cv.toDataURL('image/png')); return; }
    ms.forEach(function(c,i){
      load(c.avatar && c.avatar.k==='img'? c.avatar.v : '').then(function(im){
        const p = ms.length===1? [0,0,size,size] : (ms.length===2? [ (i?half:0),0,half,size] : [pos[i][0],pos[i][1],half,half]);
        g.save();
        g.beginPath(); g.rect(p[0],p[1],p[2],p[3]); g.clip();
        if(im){ g.drawImage(im, p[0],p[1],p[2],p[3]); }
        else {
          const col=(c.avatar&&c.avatar.bg)||'#D8D8D8';
          g.fillStyle=col; g.fillRect(p[0],p[1],p[2],p[3]);
          g.fillStyle='#fff'; g.font=Math.round(p[3]*0.32)+'px sans-serif';
          g.textAlign='center'; g.textBaseline='middle';
          g.fillText((c.avatar&&c.avatar.v&&c.avatar.v.length<=2)? c.avatar.v : (c.name||'?').slice(0,1), p[0]+p[2]/2, p[1]+p[3]/2);
        }
        g.restore();
        done++;
        if(done>=pending){ try{ resolve(cv.toDataURL('image/png')); }catch(e){ resolve(''); } }
      });
    });
  });
}

function personaPrompt(name, persona, style, gender){

  if(idx >= 0) sec = p.slice(idx, idx + 600);
  else if(p.length > 900) sec = p.slice(0, 900);
  function score(re){ return re.test(n) ? 2 : (re.test(sec) ? 1 : 0); }
  const demon = score(/魔|夜|血|火|煞|妖|渊|邪/);
  const immort = score(/仙|雪|白|霜|冰|神|尊/);
  const warm = score(/温柔|暖|阳光|元气|甜|春/);
  let hair = '墨色长发', cloth = '宽松卫衣', vibe = '温和沉静', acc = '，银色耳坠';
  let kind='neutral';
  if(immort > demon && immort >= warm) kind='immort';
  else if(demon > immort && demon >= warm) kind='demon';
  else if(warm > 0) kind='warm';
  else if(immort > 0) kind='immort';
  else if(demon > 0) kind='demon';
  if(kind==='demon'){ hair='墨色长发'; cloth='黑色夹克'; vibe='桀骜凌厉、眼神锐利'; acc='，银色耳坠'; }
  else if(kind==='immort'){ hair='银白色长发'; cloth='月白色衬衫'; vibe='清冷疏离、眉眼淡'; acc='，白玉发冠'; }
  else if(kind==='warm'){ hair='浅棕色长发'; cloth='奶白色针织衫'; vibe='温柔明亮'; acc='，小发夹'; }

  if(style==='ancient'){

  if(style==='paint'){
    return '国漫厚涂风格人物头像，'+(female?'年轻女子':'年轻男子')+'，电影级光影，细腻皮肤质感，'+hair+'，现代穿搭，'+vibe+'，深色渐变背景，高对比，厚涂笔触，方构图，头像特写';
  }
  const glass = kind==='demon'? '，细框眼镜' : '';
  return '现代日系动漫头像，平涂赛璐璐上色，干净线稿，'+(female?'少女':'少年')+'，'+hair+'，'+cloth+'，精致大眼睛，睫毛分明，'+vibe+'，纯色或柔和渐变背景'+(female?'，精致发饰':'，银色耳坠')+glass+'，方构图，头像特写';
}
function fetchAsDataURL(url){
  return fetch(url, {mode:'cors'}).then(function(r){
    if(!r.ok) throw new Error('img '+r.status);
    return r.blob();
  }).then(function(b){
    return new Promise(function(res, rej){
      const fr=new FileReader();
      fr.onload=function(){ res(fr.result); };
      fr.onerror=function(){ rej(new Error('read fail')); };
      fr.readAsDataURL(b);
    });
  });
}
async function aiAvatar(name, persona, gender){
  const cfg = (S && S.settings && S.settings.img) || {};
  if(!cfg.key) throw new Error('没有配置图像 API Key');
  const base=(cfg.base||'https://api.siliconflow.cn/v1').replace(/\/+$/,'');
  const body={ model: cfg.model||'Kwai-Kolors/Kolors', prompt: personaPrompt(name, persona, (cfg&&cfg.style)||'modern', gender), image_size:'1024x1024', batch_size:1 };
  const res=await fetch(base+'/images/generations', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  const im=(data.images&&data.images[0])||data.data&&data.data[0]||{};
  if(im.b64_json) return 'data:image/png;base64,'+im.b64_json;
  if(!im.url) throw new Error('接口没返回图片');
  try{ return await fetchAsDataURL(im.url); }catch(e){ return im.url; }
}

  try{ return cv.toDataURL('image/jpeg',.72); }catch(e){ return ''; }
}

/* 最小 zip 读取：只取 word/document.xml */
function unzipOne(buf, wantName){
  return new Promise(function(resolve, reject){
    try{
      const dv=new DataView(buf);

      let eocd=-1;
      for(let i=buf.byteLength-22; i>=Math.max(0,buf.byteLength-66000); i--){

      }

      const cdCount=dv.getUint16(eocd+10,true);
      let off=dv.getUint32(eocd+16,true);
      for(let n=0;n<cdCount;n++){
        if(dv.getUint32(off,true)!==0x02014b50) break;
        const method=dv.getUint16(off+10,true);
        const compSize=dv.getUint32(off+20,true);
        const nameLen=dv.getUint16(off+28,true);
        const extraLen=dv.getUint16(off+30,true);
        const cmtLen=dv.getUint16(off+32,true);
        const localOff=dv.getUint32(off+42,true);
        const name=new TextDecoder().decode(new Uint8Array(buf, off+46, nameLen));
        if(name===wantName){
          // 读 local header
          const lnameLen=dv.getUint16(localOff+26,true);
          const lextraLen=dv.getUint16(localOff+28,true);
          const dataStart=localOff+30+lnameLen+lextraLen;
          const data=new Uint8Array(buf, dataStart, compSize);
          if(method===0) return resolve(data);
          if(method===8){
            const ds=new DecompressionStream('deflate-raw');
            const stream=new Blob([data]).stream().pipeThrough(ds);
            new Response(stream).arrayBuffer().then(function(ab){ resolve(new Uint8Array(ab)); }, reject);
            return;
          }
          return reject(new Error('不支持的压缩方式'));
        }
        off += 46 + nameLen + extraLen + cmtLen;
      }
      reject(new Error('docx 里没找到正文'));
    }catch(e){ reject(e); }
  });
}
async function readDocxText(file){
  const buf=await file.arrayBuffer();
  const xml=await unzipOne(buf, 'word/document.xml');
  let s=new TextDecoder('utf-8').decode(xml);
  s = s.replace(/<w:p [^>]*>|<w:p>/g,'\n').replace(/<w:br[^>]*\/>/g,'\n');
  s = s.replace(/<[^>]+>/g,'');
  s = s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
  return s.replace(/\n{3,}/g,'\n\n').trim();
}
async function readAnyTextFile(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.docx')) return await readDocxText(file);
  if(name.endsWith('.doc')) throw new Error('老版 .doc 暂不支持，请另存为 .docx 或 .txt');
  return await file.text();
}

/* ---------- 浏览器 TTS ---------- */
let _voicesCache=null;
function zhVoices(){
  try{
    if(!_voicesCache || !_voicesCache.length) _voicesCache = window.speechSynthesis.getVoices()||[];
    return _voicesCache.filter(function(v){ return /zh|Chinese|中文/i.test((v.lang||'')+' '+(v.name||'')); });
  }catch(e){ return []; }
}
function speakBrowser(text, profile){
  return new Promise(function(resolve){
    try{
      if(!window.speechSynthesis){ resolve(false); return; }
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text).slice(0,160));
      u.lang='zh-CN';
      u.pitch = profile? profile.pitch : 1;
      u.rate  = profile? profile.rate : 1;
      const vs=zhVoices();
      if(vs.length){
        // 尽量挑性别合适的
        const male = profile && profile.pitch<1;
        const pickV = vs.find(function(v){ return male? /male|男|yunxi|Yunxi|kangkang/i.test(v.name) : /female|女|xiaoxiao|Xiaoxiao|huihui/i.test(v.name); });
        u.voice = pickV || vs[0];
      }
      u.onend=function(){ resolve(true); };
      u.onerror=function(){ resolve(false); };
      speechSynthesis.speak(u);
      setTimeout(function(){ resolve(true); }, 8000);
    }catch(e){ resolve(false); }
  });
}

/* ---------- API TTS（硅基流动 CosyVoice，用你自己的 Key） ---------- */
async function speakApi(text, profile, overrideVoice){
  const cfg=(S.settings&&S.settings.tts)||{};
  if(cfg.mode!=='api' || !cfg.key || !cfg.baseUrl) return false;
  try{
    const base=cfg.baseUrl.replace(/\/+$/,'');
    const res=await fetch(base+'/audio/speech',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({
        model: cfg.model||'FunAudioLLM/CosyVoice2-0.5B',
        voice: overrideVoice || (profile&&profile.sf) || 'anna',
        input: String(text).slice(0,200),
        response_format:'mp3'
      })
    });
    if(!res.ok) return false;
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const audio=new Audio(url);
    audio.play();
    return true;
  }catch(e){ return false; }
}

/* 统一入口：优先 API 音色，失败回落浏览器 */
async function speakText(text, profile, overrideVoice){
  if(!text) return;
  const ok=await speakApi(text, profile, overrideVoice);
  if(!ok) await speakBrowser(text, profile);
}

/* 音色克隆（硅基流动 CosyVoice）：上传一段人声，得到可用的 voice uri */
async function cloneVoice(file, name){
  const cfg=(S.settings&&S.settings.tts)||{};
  if(!cfg.key) throw new Error('先填 CosyVoice 的 API Key');
  const base=(cfg.baseUrl||'https://api.siliconflow.cn/v1').replace(/\/+$/,'');
  const fd=new FormData();
  fd.append('model', cfg.model||'FunAudioLLM/CosyVoice2-0.5B');
  fd.append('customName', (name||'voice')+'_'+Date.now().toString(36));
  fd.append('text', '你好，我是你的专属声音。');
  fd.append('file', file, file.name||'voice.mp3');
  const res=await fetch(base+'/audio/voices',{
    method:'POST', headers:{'Authorization':'Bearer '+cfg.key}, body:fd
  });
  if(!res.ok) throw new Error('上传失败 HTTP '+res.status);
  const data=await res.json();
  if(!data.uri) throw new Error('没有返回音色 uri');
  return data.uri;
}

function chatMessagesHTML(cid){
  const c=contactById(cid), ch=chatOf(cid);
  if(!c) return '';
  const grp = isGroup(c);
  let out='', prevTs=0;
  ch.msgs.forEach(m=>{
    if(!prevTs || m.ts-prevTs > 5*MIN){
      out += '<div class="time-div">'+fmtMsgTime(m.ts)+'</div>';
    }
    prevTs = m.ts;
    if(m.type==='system'){ out += '<div class="sys-msg">'+esc(m.text)+'</div>'; return; }
    const me = m.from==='me';
    const sender = me? S.me : (contactById(m.from) || c);
    const av = sender.avatar || c.avatar;
    let inner='';
    if(m.type==='image'){
      const src=(typeof imgSrc==='function')? imgSrc(m.img) : m.img;
      const fb=(m.fallback? esc(m.fallback):'');
      inner = '<div class="bubble img" data-act="view-img" data-src="'+esc(src)+'">'
        + '<img src="'+esc(src)+'" alt="" data-fb="'+fb+'" '
        + 'onerror="if(this.dataset.fb&&!this.dataset.tried){this.dataset.tried=1;this.src=this.dataset.fb;}else{this.parentNode.innerHTML=\'<div style=&quot;padding:18px 14px;color:#999;font-size:13px&quot;>🖼 图片没加载出来</div>\'}"></div>';
    }else if(m.type==='sticker'){
      inner = '<div class="sticker" style="background:'+esc(m.bg||'#fff')+'">'+esc(m.emoji||'🙂')+'<span>'+esc(m.text||'')+'</span></div>';
    }else if(m.type==='voice'){
      const bars = [6,10,14,8,12].map(function(h,i){ return '<i style="height:'+h+'px"></i>'; }).join('');
      inner = '<div class="bubble voice-row" data-act="play-voice" data-text="'+esc(m.text||'')+'" data-cid="'+esc(m.from)+'" data-mid="'+m.id+'">'
        + '<span class="voice-bars">'+bars+'</span><span>'+(m.dur||3)+'″</span><span class="voice-txt">'+esc((m.text||'').slice(0,10))+'…</span></div>';
    }else if(m.type==='narration'){
      out += '<div class="narration-line">📖 '+esc(m.text||'')+'</div>';
      return;
    }else if(m.type==='ooc'){
      out += '<div class="ooc-line">⚙️ 指令：'+esc(m.text||'')+'</div>';
      return;
    }else if(m.type==='redpacket'){
      inner = '<div class="bubble pay-card red '+(m.opened?'opened':'')+'" data-act="open-pay" data-mid="'+m.id+'" data-cid="'+cid+'">'
        + '<div class="pay-head"><span class="pay-ico">🧧</span><span class="pay-title">'+(m.opened? '红包已领取':'恭喜发财，大吉大利')+'</span></div>'
        + (m.note? '<div class="pay-note">'+esc(m.note)+'</div>' : '')
        + '<div class="pay-foot"><span>微信红包</span><span class="pay-amt">'+(m.opened? '¥'+m.amount : '')+'</span></div>'
        + '</div>';
    }else if(m.type==='transfer'){
      inner = '<div class="bubble pay-card blue '+(m.accepted?'opened':'')+'" data-act="open-pay" data-mid="'+m.id+'" data-cid="'+cid+'">'
        + '<div class="pay-head"><span class="pay-ico">💰</span><span class="pay-title">转账给你</span></div>'
        + '<div class="pay-amount">¥'+esc(String(m.amount))+'</div>'
        + (m.note? '<div class="pay-note">'+esc(m.note)+'</div>' : '')
        + '<div class="pay-foot"><span>'+(m.accepted? '已收款':'待收款')+'</span><span>'+(m.accepted? '¥'+m.amount : '')+'</span></div>'
        + '</div>';
    }else if(m.type==='location'){
      inner = '<div class="bubble"><div style="font-weight:500">📍 '+esc(m.text)+'</div>'
        + '<div style="height:70px;margin-top:6px;border-radius:4px;background:linear-gradient(135deg,#DCEBE0,#C9E2F5);position:relative">'
        + '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px">📍</div></div></div>';
    }else{
      const long = (m.text||'').length>140;
      inner = '<div class="bubble'+(long?' long':'')+'">'+esc(m.text)+'</div>';
    }
    const nameLabel = (grp && !me)? '<div class="sender-name">'+esc(sender.name)+'</div>' : '';
    out += '<div class="crow '+(me?'me':'them')+'" data-mid="'+m.id+'" data-cid="'+cid+'" data-long="msg">'
      + avHTML(av) + '<div class="msgcol">' + nameLabel + inner
      + (m.meta? '<div style="font-size:11px;color:var(--txt2);margin-top:3px;opacity:.85">'+esc(m.meta)+'</div>' : '')
      + '</div></div>';
  });
  if(ch.typing){
    const who = (ch.typingName? esc(ch.typingName) : (grp? '有人':'对方')) + '正在输入…';
    out += '<div class="crow them">'+avHTML(c.avatar)+'<div class="msgcol"><div class="bubble typing"><i></i><i></i><i></i></div></div></div>';
    out += '<div class="msg-meta" id="typingMeta" style="text-align:left;padding-left:52px;margin-top:-10px">'+who+'</div>';
  }
  return out;
}

function avatarPickerHTML(cur,who){
  const isEmoji = cur && cur.k==='emoji';
  return AV_EMOJIS.slice(0,20).map((e,i)=>{
    const bg = AV_BGS[i%AV_BGS.length];
    const on = isEmoji && cur.v===e;
    return '<button class="av-opt '+(on?'on':'')+'" style="background:'+bg+'" data-act="pick-avatar" data-who="'+who+'" data-v="'+e+'" data-bg="'+bg+'">'+e+'</button>';
  }).join('')
  + '<label class="av-add" style="position:relative;overflow:hidden;cursor:pointer">'
  + '<input type="file" accept="image/*" data-file="'+(who==='me'?'avatar-me':'avatar-char')+'" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:3">📷</label>';
}

/* ==================== 添加朋友 ==================== */
function viewAdd(){
  const have = S.contacts.map(c=>c.name);
  const rec = PRESETS.filter(p=>have.indexOf(p.name)<0);
  const pend = S.friends.filter(f=>f.status==='pending');
  return '<div class="page anim">'+navHTML({title:'添加朋友'})
    + '<div class="scroll">'
    + '<div class="search-wrap" style="padding-top:10px"><div class="search-box">'+I.search+'<input id="addSearch" placeholder="微信号 / 昵称"></div></div>'
    + '<div style="padding:4px 16px 8px;font-size:13px;color:var(--sub)">推荐角色</div>'
    + '<div class="pick-grid one" id="recList">'
    + rec.map((p,i)=>'<div class="pick" data-name="'+esc(p.name)+'">'+avHTML({k:'emoji',v:p.emoji,bg:p.bg},'sm')
        + '<div class="n">'+esc(p.name)+'<div style="font-size:11px;color:var(--sub);font-weight:400">'+esc(p.role)+'</div></div>'
        + '<button class="btn-mini" data-act="add-preset" data-i="'+PRESETS.indexOf(p)+'">添加</button></div>').join('')
      + (rec.length? '' : '<div class="empty" style="grid-column:1/-1">推荐的角色都已经加过了</div>')
    + '</div>'
    + (pend.length? '<div style="padding:16px 16px 8px;font-size:13px;color:var(--sub)">新的朋友</div><div class="pick-grid one">'
      + pend.map(f=>'<div class="pick">'+avHTML(f.avatar,'sm')+'<div class="n">'+esc(f.name)+'</div>'
        + '<button class="btn-mini" data-act="accept-friend" data-id="'+f.id+'">接受</button></div>').join('')+'</div>':'')
    + '<div class="form-block" style="margin-top:16px">'
    + '<div class="me-row" data-act="go" data-to="#/character/new"><div class="me-icon" style="background:#07C160">✎</div>'
    + '<div class="t">创建自定义角色</div><span class="chev">'+I.chev+'</span></div>'
    + '<div class="me-row" data-act="import-card"><div class="me-icon" style="background:#7C5CFC">📥</div>'
    + '<div class="t">导入角色卡</div><span class="chev">'+I.chev+'</span></div>'
    + '</div>'
    + '<div class="foot-tip">自定义角色可以设置人设、说话风格、口头禅，和一个真实的朋友没差别。</div>'
    + '</div></div>';
}

/* ==================== 语音通话 ==================== */
function viewCall(cid){
  const c=contactById(cid); if(!c) return notFound();
  const call=c.call||{startedAt:Date.now()};
  const prof=(typeof voiceById==='function')? voiceById(c.voice) : null;
  return '<div class="call-page">'
    + '<div class="call-top"><span class="call-name">'+esc(c.name)+'</span>'
    + '<span class="call-status">通话中 · <b id="callTimer">00:00</b></span></div>'

    + '<div class="call-hint" id="callHint">正在接通…</div>'
    + '<div class="call-wave" id="callWave"><i></i><i></i><i></i><i></i><i></i></div>'
    + '<div class="call-actions">'
    + '<button class="call-end" data-act="end-call" data-id="'+cid+'">挂断</button>'

/* ==================== 赴约（线下沉浸叙事） ==================== */
function viewDate(cid){
  const c=contactById(cid); if(!c) return notFound();
  const d=c.date;
  if(!d) return '<div class="page anim">'+navHTML({title:'赴约'})+'<div class="empty">还没有进行中的赴约</div></div>';
  const mins=Math.max(1, Math.round((Date.now()-(d.startedAt||Date.now()))/60000));
  return '<div class="date-page">'
    + '<div class="date-head"><span data-act="back">‹ 返回</span><span class="date-name">'+esc(c.name)+'</span>'
    + '<span class="date-time">已进行 '+mins+' 分钟</span></div>'
    + '<div class="date-body" id="dateBody">'+(d.paras||[]).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')
      + (d.writing? '<p class="writing">Writing…</p>' : '') + '</div>'
    + '<div class="date-foot"><span class="date-tag">📍 '+esc(d.sceneName||'')+'</span>'
      + '<span class="date-tag gray">'+esc(d.entry||'')+'</span>'
      + '<button class="date-end" data-act="end-date" data-id="'+cid+'">结束赴约</button></div>'
    + '<div class="date-input"><input id="dateInput" data-inp="date" data-cid="'+cid+'" placeholder="你说点什么，或做一个动作…">'
      + '<button data-act="date-send" data-id="'+cid+'">发送</button></div>'
    + '</div>';
}

/* ==================== 日程 ==================== */
function viewSchedule(){
  const list=(S.schedule||[]).slice().sort(function(a,b){ return b.ts-a.ts; });
  return '<div class="page anim">'+navHTML({title:'日程'})
    + '<div class="scroll">'
    + (list.length? list.map(function(it){
        const d=new Date(it.ts);
        const hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
        const day=(d.getMonth()+1)+'月'+d.getDate()+'日';
        return '<div class="form-block" style="padding:12px 16px">'
          + '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--sub)"><span>'+day+' '+hm+'</span><span>📍'+esc(it.scene||'')+'</span></div>'
          + '<div style="font-size:15px;margin-top:6px;font-weight:500">'+esc(it.title||'赴约')+'</div>'

/* ==================== 聊天记录搜索 ==================== */
function viewChatSearch(cid){

  return '<div class="page anim">'+navHTML({title:'查找聊天记录'})

    + '<div class="scroll" id="searchResults"><div class="empty"><span class="big">🔍</span>输入关键词开始搜索</div></div>'
    + '</div>';
}
function searchResultsHTML(cid, q){
  const ch=chatOf(cid);
  q=(q||'').trim();
  if(!q) return '<div class="empty"><span class="big">🔍</span>输入关键词开始搜索</div>';
  const hits=(ch.msgs||[]).filter(function(m){
    return (m.type==='text'||m.type==='voice'||m.type==='location') && String(m.text||'').indexOf(q)>=0;
  }).slice(-60).reverse();
  if(!hits.length) return '<div class="empty">没有找到「'+esc(q)+'」</div>';
  return hits.map(function(m){
    const me=m.from==='me';
    const who=me? S.me.name : (contactById(m.from)||{}).name||cname;
    const txt=String(m.text||'').split(q).join('【'+q+'】');
    return '<div class="row" style="align-items:flex-start">'
      + '<div class="row-main"><div class="row-title" style="font-size:13px;color:var(--sub)">'+esc(who)+' · '+fmtMsgTime(m.ts)+'</div>'
      + '<div style="font-size:15px;margin-top:4px;line-height:1.5;word-break:break-word">'+esc(txt)+'</div></div></div>';
  }).join('');
}

function viewStickers(){

/* ==================== 群聊 ==================== */
function viewGroups(){
