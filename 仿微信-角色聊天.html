      : '<div class="empty"><span class="big">👥</span>还没有群聊<br>新建一个，把角色拉进来</div>')
    + '<div class="form-block" style="margin-top:12px">'
    + '<div class="me-row" data-act="go" data-to="#/group/new"><div class="me-icon" style="background:#07C160">＋</div><div class="t">新建群聊</div><span class="chev">'+I.chev+'</span></div>'

function viewGroupNew(){

    + '<div class="scroll">'
    + '<div class="form-block" style="margin-top:9px">'
    + '<div class="form-item"><span class="k">群名称</span><input type="text" id="gName" placeholder="比如：三界修罗场"></div>'
    + '<div class="form-item col"><span class="k">群设定 / 剧本（可选，会写进提示词）</span>'
    + '<textarea id="gScript" placeholder="比如：谢无衍和夜渊是两千年的死对头，都护着女主，会互相阴阳怪气，但谁都不会真的伤她。"></textarea></div>'
    + '</div>'
    + '<div class="form-block">'
    + '<div class="form-item"><span class="k wide">选择成员（至少 1 个）</span><span class="v" id="selCount">已选 '+sel.length+' 人</span></div>'
    + '<div class="pick-grid one">'
    + cs.map(function(c){
        const on = sel.indexOf(c.id)>=0;
        return '<div class="pick" data-act="toggle-gmember" data-cid="'+c.id+'">'+avHTML(c.avatar,'sm')
          + '<div class="n">'+esc(c.name)+'<div style="font-size:11px;color:var(--sub)">'+esc(c.role||'朋友')+'</div></div>'
          + '<div class="check '+(on?'on':'')+'">✓</div></div>';
      }).join('')
    + (cs.length? '' : '<div class="empty" style="grid-column:1/-1">先去通讯录加几个角色</div>')
    + '</div></div>'
    + '<div class="foot-tip">群里的每个角色都按自己的人设说话；接了大模型后，他们还会互相接话、呛声。</div>'
    + '</div></div>';
}

/* ==================== 新的朋友 ==================== */
function viewFriends(){
  const fs = S.friends;
  return '<div class="page anim">'+navHTML({title:'新的朋友'})
    + '<div class="scroll">'
    + (fs.length? fs.map(f=>'<div class="row" style="gap:12px">'+avHTML(f.avatar)
        + '<div class="row-main"><div class="row-title"><span class="name">'+esc(f.name)+'</span></div>'
        + '<div class="row-desc">'+esc(f.msg||'请求添加你为朋友')+'</div></div>'
        + (f.status==='pending'
          ? '<button class="btn-mini" data-act="accept-friend" data-id="'+f.id+'">接受</button>'
          : '<span class="v" style="color:var(--sub);font-size:13px">已添加</span>')
        + '</div>').join('')
      : '<div class="empty"><span class="big">👋</span>暂时没有新的朋友请求</div>')
    + '</div></div>';
}

</script>
<script>
/* ==== app.js ==== */
'use strict';
/* ==================== 应用逻辑 ==================== */
let curChatId = null;
let ED = null;
let DRAFT = { moment: { imgs: [], vis: { mode:'all', ids:[] }, loc:'' } };
let GROUP_SEL = [];
let FILE_MODE = '';
let PANEL = '';
let replyToken = 0;
let suppressClick = false;
let toastTimer = null;
const TAB_ROUTES = ['chats','contacts','discover','me'];

function $(id){ return document.getElementById(id); }
function val(id){ const el=$(id); return el? el.value : ''; }
function scrollChatBottom(){
  const b=$('chatBody'); if(b) b.scrollTop = b.scrollHeight + 999;
}

/* ---------- 启动 ---------- */
document.addEventListener('DOMContentLoaded', async function(){
  if(typeof idbInit==='function'){ try{ await idbInit(); }catch(e){} }
  await load();
  applySettings();
  bindGlobal();
  if(!location.hash){ try{ history.replaceState(null,'','#/chats'); }catch(e){ location.hash='#/chats'; } }
  route();
  setTimeout(function(){ diag('boot'); }, 600);
  const boot=$('boot'); if(boot) boot.remove();
  setTimeout(warmStart, 2200);
  setInterval(function(){
    try{
      if(Math.random()<0.18 && (S.settings.ai&&S.settings.ai.mode==='api')) incomingCall();
    }catch(e){}
  }, 80000);
  if(typeof storageQuota==='function'){
    storageQuota().then(function(q){ window.__QUOTA=q; });
  }
  setTimeout(function(){
    try{
      if(typeof IDB_OK!=='undefined' && IDB_OK) return;   // 有 IDB 就不怕
      if(storageBytes() > 4.2*1024*1024) window.__onStorageFull();
    }catch(e){}
  }, 2000);
  if(typeof storageOK!=='undefined' && !storageOK){
    setTimeout(function(){ toast('提醒：当前环境无法本地保存数据，请及时导出备份', true); }, 1500);
  }
});

function shadeColor(hex, p){
  const n=parseInt(String(hex).replace('#',''),16);
  if(isNaN(n)) return hex;
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.max(0,Math.min(255, Math.round(r*(1+p/100))));
  g=Math.max(0,Math.min(255, Math.round(g*(1+p/100))));
  b=Math.max(0,Math.min(255, Math.round(b*(1+p/100))));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function applySettings(){
  const b=S.settings.bubble;
  const th=BUBBLE_THEMES.find(t=>t.k===b.theme)||BUBBLE_THEMES[0];
  const r=document.documentElement.style;
  r.setProperty('--bubble-me', th.me);
  r.setProperty('--bubble-me-txt', th.txt);
  r.setProperty('--radius', b.radius+'px');
  r.setProperty('--fs', b.fs+'px');
  const tc = S.settings.themeColor || '#07C160';
  r.setProperty('--green', tc);
  r.setProperty('--green-d', shadeColor(tc, -14));
  const appEl=$('app');
  const ab = S.settings.appBg;
  if(ab){
    appEl.setAttribute('style', bgStyle(ab));
    document.body.classList.add('has-appbg');
    if(ab.k==='img') document.body.classList.add('wallpaper'); else document.body.classList.remove('wallpaper');
  }else{
    appEl.removeAttribute('style');
    document.body.classList.remove('has-appbg','wallpaper');
  }
  document.body.classList.toggle('dark', !!S.settings.dark);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', S.settings.dark? '#1A1A1A':'#EDEDED');
}
let quotaShown=false;
/* ---------- 诊断上报（把状态发回本地服务端日志） ---------- */
function diag(ev, data){
  try{
    let d={};
    try{ d=data||{}; }catch(e){}
    d.build=window.__BUILD||'?';
    d.origin=location.origin||location.protocol;
    d.route=window.__route||'';
    try{ d.idb=!!IDB_OK; }catch(e){}
    try{ d.contacts=(S.contacts||[]).length; }catch(e){}
    try{ d.aiMode=(S.settings.ai||{}).mode; d.aiKey=((S.settings.ai||{}).key||'').slice(0,6); }catch(e){}
    try{ d.ttsMode=(S.settings.tts||{}).mode; d.ttsKey=((S.settings.tts||{}).key||'').slice(0,6); }catch(e){}
    try{ d.asrMode=(S.settings.asr||{}).mode; d.asrKey=((S.settings.asr||{}).key||'').slice(0,6); }catch(e){}
    d.t=Date.now();
    const q='?e='+encodeURIComponent(ev)+'&d='+encodeURIComponent(JSON.stringify(d));
    new Image().src='http://127.0.0.1:8899/_log'+q;
  }catch(e){}
}
window.__diag=diag;
window.addEventListener('error', function(ev){
  try{
    var bar=document.getElementById('__errBar');
    if(!bar){
      bar=document.createElement('div'); bar.id='__errBar';
      bar.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#FA5151;color:#fff;font-size:12px;padding:6px 10px;line-height:1.4;white-space:pre-wrap';
      document.body.appendChild(bar);
    }
    bar.textContent='出错：'+(ev.message||'未知错误')+'（截图告诉我即可）';
    diag('jserror', {msg:ev.message, line:ev.lineno, src:(ev.filename||'').slice(-40)});
    setTimeout(function(){ if(bar) bar.remove(); }, 8000);
  }catch(e){}
});
window.__onStorageFull = function(){
  if(quotaShown) return;
  quotaShown=true;
  confirmDialog('本地存储空间不足',
    '浏览器的本地空间（约 5MB）被图片占满了，新的聊天记录可能存不下来。\n\n点「立即压缩」会把存储里的图片全部压小（内容不变，画质略降），一般能腾出一大半空间。',
    '立即压缩', false, function(){ compressAllImages(); });
};

/* ---------- 路由 ---------- */
function route(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  const p=h.split('/').filter(Boolean);
  const seg0=p[0]||'chats', seg1=p[1];
  let key=seg0;
  if(seg0==='moment' && seg1==='new') key='moment/new';
  const a=p[1], b=p[2];
  const view=$('view');
  if(window.__route==='chat' && curChatId){
    const inp=$('msgInput'); if(inp) chatOf(curChatId).draft = inp.value;
  }
  let html='', isTab=false, tabName='';
  switch(key){
    case 'chats': html=viewChats(); isTab=true; tabName='chats'; break;
    case 'contacts': html=viewContacts(); isTab=true; tabName='contacts'; break;
    case 'discover': html=viewDiscover(); isTab=true; tabName='discover'; break;
    case 'me': html=viewMe(); isTab=true; tabName='me'; break;
    case 'chat': curChatId=a; html=viewChat(a); break;
    case 'chatbg': if(typeof ensureWalls==='function') ensureWalls(); html=viewChatBg(a); break;
    case 'contact': html=viewContact(a); break;
    case 'character': { const cid=(a&&a!=='new')?a:''; ensureED(cid); html=viewCharacter(cid); break; }
    case 'add': html=viewAdd(); break;
    case 'friends': html=viewFriends(); break;
    case 'chatsearch': html=viewChatSearch(a); break;
    case 'date': html=viewDate(a); break;
    case 'call': html=viewCall(a); break;
    case 'schedule': html=viewSchedule(); break;
    case 'groups': html=viewGroups(); break;
    case 'group':
      if(seg1==='new'){
        if(window.__route!=='group') GROUP_SEL=[];
        html=viewGroupNew();
      } else html=viewGroups();
      break;
    case 'moments': html=viewMoments(); S.meta.momentsDot=false; save(); break;
    case 'moment/new': html=viewMomentNew(); break;
    case 'settings':
      if(!seg1) html=viewSettings();
      else if(seg1==='bg'){ if(typeof ensureWalls==='function') ensureWalls(); html=viewSettingsBg(); }
      else if(seg1==='bubble') html=viewSettingsBubble();
      else if(seg1==='theme') html=viewSettingsTheme();
      else if(seg1==='stickers') html=viewStickers();
      else if(seg1==='ai') html=viewSettingsAI();
      else html=viewSettingsData();
      break;
    case 'profile': html=viewProfile(); break;
    default: html=viewChats(); isTab=true; tabName='chats';
  }
  view.innerHTML = html;
  window.__route = key;
  const tb=$('tabbar');
  if(isTab){ tb.innerHTML=tabbarHTML(tabName); tb.classList.add('show'); }
  else { tb.classList.remove('show'); tb.innerHTML=''; }
  applySettings();
  PANEL='';
  if(seg0==='settings' && seg1==='data'){
    if(typeof storageQuota==='function'){
      storageQuota().then(function(q){
        window.__QUOTA=q;
        var el=document.getElementById('quotaVal');
        if(el && q.quota) el.textContent = fmtSize(q.quota - q.usage) + ' 可用';
      });
    }
  }
  if(key==='chat'){ scrollChatBottom(); syncSendBtn(); }
  if(key==='moment/new') renderMomentImgs();
  if(key==='settings/bubble'){ /* 预览已内联 */ }
  if(key==='character'){ /* 状态由 ED 保存 */ }
}
window.addEventListener('hashchange', function(){ route(); });

function refreshTabbar(){
  const tb=$('tabbar');
  if(!tb.classList.contains('show')) return;
  const cur=$('tabbar').querySelector('.tab-item.active');
  const name = cur? cur.dataset.tab : 'chats';
  tb.innerHTML = tabbarHTML(name);
}
function softRerender(){
  const sc=$('chatListScroll'); const st=sc? sc.scrollTop:0;
  route();
  const sc2=$('chatListScroll'); if(sc2) sc2.scrollTop=st;
}
function refreshChat(){
  if(!curChatId) return;
  const inner=$('chatInner'); if(!inner) return;
  inner.innerHTML = chatMessagesHTML(curChatId);
  scrollChatBottom();
  const ch=chatOf(curChatId);
  const sub=$('chatSub');
  const cc=contactById(curChatId);
  if(sub) sub.textContent = (cc && cc.isGroup)
    ? (ch.typing? ((ch.typingName||'有人')+'正在输入…') : (groupMembers(cc).length+' 人'))
    : (ch.typing? '对方正在输入…' : (ch.muted? '已静音':'在线'));
}
function refreshChatIfHere(cid){
  if(window.__route==='chat' && curChatId===cid) refreshChat();
}
window.__onImgLoaded = function(){
  try{ if(window.__route==='chat') refreshChat(); else if(window.__route==='chatbg') route(); else if(window.__route==='moments') refreshFeed(); }catch(e){}
};
function refreshFeed(){
  const f=$('mFeed'); if(!f) return;
  const posts=visibleMoments();
  f.innerHTML = posts.length? posts.map(momentHTML).join('') : '<div class="empty"><span class="big">🌿</span>还没有动态</div>';
}

/* ---------- 全局事件 ---------- */
let lpTimer=null, lpEl=null, lpStart=null;
function clearLP(){ clearTimeout(lpTimer); lpTimer=null; lpEl=null; lpStart=null; }

function bindGlobal(){
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('focusin', function(e){
    if(e.target && e.target.id==='msgInput' && PANEL) togglePanel(PANEL);
  });
  document.addEventListener('pointerdown', function(e){
    const el=e.target.closest('[data-long]');
    if(!el) return;
    clearLP(); lpEl=el; lpStart={x:e.clientX,y:e.clientY};
    lpTimer=setTimeout(function(){
      const t=lpEl; lpTimer=null; lpEl=null; lpStart=null;
      if(t){ suppressClick=true; doLongPress(t); }
    }, 480);
  }, {passive:true});
  document.addEventListener('pointerup', clearLP, {passive:true});
  document.addEventListener('pointercancel', clearLP, {passive:true});
  document.addEventListener('pointermove', function(e){
    if(lpStart && (Math.abs(e.clientX-lpStart.x)>9 || Math.abs(e.clientY-lpStart.y)>9)) clearLP();
  }, {passive:true});
  window.addEventListener('scroll', clearLP, true);
  const fi=$('fileImg'), fc=$('fileImgCrop');
  if(fi) fi.addEventListener('change', onFilePick);
  if(fc) fc.addEventListener('change', onFilePick);
  document.addEventListener('change', function(e){
    const el=e.target;
    if(el && el.id==='cardFile' && el.files && el.files[0]){
      importCardFile(el.files[0]);
      return;
    }
    if(el && el.tagName==='INPUT' && el.type==='file' && el.dataset && el.dataset.file){
      FILE_MODE = el.dataset.file;
      onFilePick(e);
    }
  });
}

function onInput(e){
  const t=e.target;
  if(t.id==='msgInput'){
    if(curChatId){ chatOf(curChatId).draft=t.value; save(); }
    syncSendBtn();
    t.style.height='auto'; t.style.height=Math.min(t.scrollHeight, 96)+'px';
  }
  if(t.id==='chatSearchInput'){
    const box=document.getElementById('searchResults');
    if(box) box.innerHTML=searchResultsHTML(t.dataset.cid, t.value);
    return;
  }
  if(t.id==='addSearch'){
    const q=t.value.trim();
    document.querySelectorAll('#recList .pick').forEach(function(el){
      el.style.display = (!q || el.dataset.name.indexOf(q)>=0)? 'flex':'none';
    });
  }
  if(t.id==='chatSearch' || t.id==='contact-search'){
    filterRows(t.value.trim());
  }
  if(t.id==='cRemark'){
    const c=contactById(t.dataset.cid);
    if(c){ c.remark=t.value.trim(); save(); const ti=document.querySelector('.nav-title'); if(ti) ti.textContent=c.remark||c.name; }
  }
  if(t.dataset && t.dataset.inp==='bubble-radius'){ /* handled inline */ }

  /* 设置页的 data-cfg 字段（tts/asr 等）*/
  if(t.dataset && t.dataset.cfg){
    const path=t.dataset.cfg.split('.');
    if(path.length===2){
      S.settings[path[0]]=S.settings[path[0]]||{};
      S.settings[path[0]][path[1]]=t.value;
      save();
    }
    return;
  }
  /* 编辑页：角色级 API 字段 */
  if(t.dataset && t.dataset.inp && ED && ['apiBase','apiKey','apiModel','apiTemp'].indexOf(t.dataset.inp)>=0){

/* ---------- 真实语音对聊（录音 → 转文字 → 发送） ---------- */
let _rec=null, _recChunks=[], _sr=null;
async function startVoiceInput(){
  if(_rec){ stopVoiceInput(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _recChunks=[];
    _rec=new MediaRecorder(stream);
    _rec.ondataavailable=function(e){ if(e.data && e.data.size) _recChunks.push(e.data); };
    _rec.onstop=async function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      const blob=new Blob(_recChunks,{type:_rec.mimeType||'audio/webm'});
      _rec=null;
      await transcribeAndSend(blob);
    };
    _rec.start();
    toast('🎙 正在听…再点一次结束');
    const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SRec && !_sr){
      try{
        _sr=new SRec(); _sr.lang='zh-CN'; _sr.continuous=true; _sr.interimResults=true;
        let finalText='';
        _sr.onresult=function(ev){
          let interim='';
          for(let i=ev.resultIndex;i<ev.results.length;i++){
            const r=ev.results[i];
            if(r.isFinal) finalText+=r[0].transcript;
            else interim+=r[0].transcript;
          }
          const el=$('msgInput');
          if(el) { el.value=finalText+interim; }
          window.__srText=finalText;
        };
        _sr.onerror=function(){};
        _sr.start();
      }catch(e){}
    }
  }catch(e){
    toast('打不开麦克风：'+e.message);
  }
}
function stopVoiceInput(){
  try{ if(_sr){ _sr.stop(); _sr=null; } }catch(e){}
  try{ if(_rec){ _rec.stop(); } }catch(e){}
}
async function transcribeAndSend(blob){
  const text=(window.__srText||($('msgInput')&&$('msgInput').value)||'').trim();
  window.__srText='';
  if(text && text.length>1){
    const el=$('msgInput'); if(el) el.value=text;
    const c=contactById(curChatId);
    pushMsg(curChatId,{from:'me',type:'text',text:text,ts:Date.now(),read:true});
    const ch=chatOf(curChatId); ch.draft=''; if(el) el.value='';
    save(); refreshChat(); refreshTabbar();
    if(c) dispatchReply(c, text, ch);
    return;
  }
  // 没有浏览器识别 → 走 API 语音转文字
  const cfg=(S.settings&&S.settings.asr)||{};
  if(cfg.mode==='api' && cfg.key && cfg.baseUrl){
    try{
      toast('正在识别语音…');
      const fd=new FormData();
      fd.append('file', blob, 'voice.webm');
      fd.append('model', cfg.model||'FunAudioLLM/SenseVoiceSmall');
      const res=await fetch(cfg.baseUrl.replace(/\/+$/,'')+'/audio/transcriptions',{
        method:'POST', headers:{'Authorization':'Bearer '+cfg.key}, body:fd
      });
      const data=await res.json();
      const txt=(data.text||'').trim();
      if(txt){
        pushMsg(curChatId,{from:'me',type:'text',text:txt,ts:Date.now(),read:true});
        save(); refreshChat(); refreshTabbar();
        const c2=contactById(curChatId);
        if(c2) dispatchReply(c2, txt, chatOf(curChatId));
      }else toast('没识别出内容');
    }catch(e){ toast('语音识别失败：'+e.message); }
  }else{
    toast('没识别到语音。可在设置里配置语音识别 API');
  }
}
function sendVoiceMsg(){
  if(!curChatId) return;
  const ch=chatOf(curChatId);

/* ---------- 语音通话：全自动听（录音+静音检测+ASR） ---------- */
let callTimer=null, callActive=false, callSpeaking=false;
let callStream=null, callCtx=null, callRec=null, callChunks=[], callRaf=null;
function setCallHint(txt, cls){

function startCall(cid){

  setTimeout(function(){
    clearInterval(callTimer);
    callTimer=setInterval(function(){
      const el=document.getElementById('callTimer');
      if(!el){ clearInterval(callTimer); return; }
      const s=Math.floor((Date.now()-c.call.startedAt)/1000);
      el.textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
      // 角色可能主动想挂断（90 秒后，概率随时间上升）
      const dur=s;
      if(dur>75 && Math.random()<0.004){ hangupByCharacter(cid); }
    },1000);
    diag('call-start',{});
    const greet=pick(['喂？能听见吗。','嗯，我接了。','怎么突然打电话过来。']);
    callSpeak(cid, greet);
  }, 350);
}
async function callSpeak(cid, text){
  const c=contactById(cid); if(!c) return;
  callSpeaking=true; stopListening();
  setCallHint('TA 在说…','speaking');
  // 模型想挂断
  let hang=false;
  if(/\[\s*挂断\s*\]|（挂断）|\(挂断\)/.test(text)){ hang=true; text=text.replace(/\[\s*挂断\s*\]|（挂断）|\(挂断\)/g,''); }
  const prof=(typeof voiceById==='function')? voiceById(c.voiceProfile||c.voice) : null;
  try{
    const cloned = c && c.voiceClone && c.voiceClone.uri;
    if(typeof speakText==='function'){ await speakText(text, prof, cloned); }
    else if(window.speechSynthesis){
      await new Promise(function(res){
        const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN';
        if(prof){ u.pitch=prof.pitch; u.rate=prof.rate; }
        u.onend=res; u.onerror=res; speechSynthesis.speak(u); setTimeout(res,8000);
      });
    }
  }catch(e){}
  callSpeaking=false;
  if(!callActive) return;
  if(hang){ setTimeout(function(){ endCall(cid, true); }, 700); return; }
  startListening(cid);
}
/* 自动听：录音 + 音量检测，说完自动提交 */
async function startListening(cid){
  if(!callActive || callSpeaking) return;
  const cfg=(S.settings&&S.settings.asr)||{};
  if(!(cfg.mode==='api' && cfg.key)){
    setCallHint('请先在 设置→角色引擎 填语音识别 Key');
    callFallbackInput(cid,'没有识别 Key，先打字说');
    return;
  }
  (async function(){
    try{
      if(!callStream){ callStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
      setCallHint('在听…（直接说话）','listening');
      diag('listen-start',{});
      callChunks=[];
      const rec=new MediaRecorder(callStream);
      callRec=rec;
      rec.ondataavailable=function(e){ if(e.data && e.data.size) callChunks.push(e.data); };
      rec.onstop=async function(){
        if(callRec===rec) callRec=null;
        const blob=new Blob(callChunks,{type:rec.mimeType||'audio/webm'});
        diag('rec-stopped',{size:blob.size});
        if(!callActive || callSpeaking) return;
        if(blob.size<2000){ setCallHint('没听到声音，继续…','listening'); setTimeout(function(){ startListening(cid); },200); return; }
        setCallHint('听懂中…');
        const txt=await asrBlob(blob);
        if(!callActive || callSpeaking) return;
        if(!txt){ setCallHint('没听清，再说一次','listening'); setTimeout(function(){ startListening(cid); },400); return; }
        setCallHint('你说：'+txt.slice(0,16),'listening');
        handleCallSpeech(cid, txt);
      };
      rec.start(200);
      // 固定录 5 秒后提交（简单可靠，不依赖音量检测）
      clearTimeout(window.__callSeg);
      window.__callSeg=setTimeout(function(){
        try{ if(rec.state!=='inactive') rec.stop(); }catch(e){}
      }, 5000);
    }catch(e){
      diag('mic-fail',{msg:(e&&e.message||'').slice(0,60)});
      setCallHint('麦克风打不开：'+(e.name||e.message||''));
      callFallbackInput(cid,'麦克风打不开（'+(e.name||'')+'）');
    }
  })();
}
function cancelListen(clearStream){
  try{ clearTimeout(callRaf); }catch(e){}
  try{ if(callRec && callRec.state!=='inactive'){ callRec.onstop=null; callRec.stop(); } }catch(e){}
  callRec=null;
  if(clearStream){ try{ if(callStream) callStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} callStream=null; }
}
function stopListening(){ cancelListen(false); }
async function asrBlob(blob){
  const cfg=(S.settings&&S.settings.asr)||{};
  if(!cfg.key || cfg.mode!=='api'){ setCallHint('没有语音识别 Key'); return ''; }
  try{
    const fd=new FormData();
    fd.append('file', blob, 'v.webm');
    fd.append('model', cfg.model||'FunAudioLLM/SenseVoiceSmall');
    const res=await fetch((cfg.baseUrl||'https://api.siliconflow.cn/v1').replace(/\/+$/,'')+'/audio/transcriptions',
      {method:'POST', headers:{'Authorization':'Bearer '+cfg.key}, body:fd});
    if(!res.ok){
      let msg='';
      try{ msg=(await res.text()).slice(0,60); }catch(e){}
      diag('asr-http',{code:res.status, msg:msg});
      setCallHint('识别接口出错 HTTP '+res.status);
      return '';
    }
    const data=await res.json();
    return (data.text||'').trim();
  }catch(e){ diag('asr-fail',{msg:(e.message||'').slice(0,50)}); return ''; }
}

const FREQ_MAP={
  fast:{delay:0.6, skip:0},
  normal:{delay:1, skip:0},
  slow:{delay:1.8, skip:0.15},
  rare:{delay:3, skip:0.45}
};
function freqOf(c){
  if(c && typeof c.speed==='number'){
    const sp=Math.max(0, Math.min(2, c.speed));   // 0=慢 1=正常 2=快
    const delay = sp>=1 ? (1 - (sp-1)*0.5) : (1 + (1-sp)*2);   // 2→0.5x, 1→1x, 0→3x
    const skip  = sp>=1 ? 0 : Math.min(0.45, (1-sp)*0.45);
    return {delay:delay, skip:skip};
  }
  return FREQ_MAP[(c&&c.freq)||'normal'] || FREQ_MAP.normal;
}
function dispatchReply(c, text, ch){
  if(!c) return;
  const fq=freqOf(c);
  if(!c.isGroup && fq.skip && Math.random()<fq.skip){
    setTimeout(function(){
      ch.msgs.push({id:uid('m'), from:c.id, type:'text',
        text: pick(['在忙，等下回你。','稍等，手上有点事。','嗯，我看到了，晚点说。']), ts:Date.now(), read:false});
      ch.unread=(ch.unread||0)+1;
      save(); refreshChatIfHere(c.id); refreshTabbar();
    }, 2500);
    return;
  }
  const st=S.me.status||'online';
  if(st==='away'){
    // 勿扰：自动回复一次，不打扰你
    if(!ch.__autoReplied){
      ch.__autoReplied=true;
      setTimeout(function(){
        ch.msgs.push({id:uid('m'), from:c.id, type:'text', text:'（自动回复）我现在不在，看到就回你。', ts:Date.now(), read:true});
        save(); refreshChatIfHere(c.id); refreshTabbar();
      }, 1200);
    }
    return;
  }
  if(c.isGroup){ groupReplyFlow(c, text, ch); return; }
  replyFlow(c, text, ch, st==='busy');
}
function replyFlow(c, text, ch, busy, img){
  if(!c) return;
  const token=++replyToken;
  ch.typing=true; save(); refreshChatIfHere(c.id);
  generateReply(c, text, ch, null, img).then(function(r){
    if(token!==replyToken) return;
    setTimeout(function(){
      if(token!==replyToken) return;
      const texts=(r.texts&&r.texts.length)? r.texts:['嗯'];
      let i=0;
      function step(){
        if(token!==replyToken){ ch.typing=false; save(); return; }
        let t=texts[i++];
        let meta='';
        if(!c.isGroup){
          if(c.story && c.story.on){
            try{
              const ps=parseStory(t, c);
              if(ps.text) t=ps.text;
              if(ps.changed.length) meta=ps.changed.join(' · ');
            }catch(e){}
          }
          if(!meta && c.story && c.story.on){
            try{
              const rd=randStoryDelta(c);
              if(rd.length) meta=rd.join(' · ');
            }catch(e){}
          }
        }
        ch.typing = (i < texts.length);
        const here = (window.__route==='chat' && curChatId===c.id);
        ch.msgs.push({id:uid('m'), from:c.id, type:'text', text:t, ts:Date.now(), read:here, meta:meta||undefined});
        if(!here){ ch.unread=(ch.unread||0)+1; }
        if(!c.isGroup) addAffinity(c, 2);
        save();
        if(here){ refreshChat(); storyBarRefresh(c.id); } else { refreshTabbar(); if(window.__route==='chats') softRerender(); }
        if(!c.isGroup && Math.random()<0.05){
          const amt=(Math.random()*20+1).toFixed(2);
          const kind=Math.random()<0.55? 'redpacket':'transfer';
          ch.msgs.push({id:uid('m'), from:c.id, type:kind, amount:amt,
            note: kind==='redpacket'? pick(['拿去花','刚想起来','买点好吃的']) : pick(['给你的','别拒绝','拿着']),
            opened:false, accepted:false, ts:Date.now(), read:true});
          save(); setTimeout(function(){ refreshChatIfHere(c.id); }, 400);
        }
        if(i<texts.length) setTimeout(step, 650+Math.random()*500);
        else {
          ch.typing=false;
          if(!c.isGroup && Math.random()<0.22) attachment(c, ch);
          save(); refreshChatIfHere(c.id); refreshTabbar();
        }
      }
      ch.typing = texts.length>1;
      step();
      if(r.via==='local-fallback' && r.err){
        console.warn('API 失败:', r.err);
        try{ diag('api-fail', {err:String(r.err).slice(0,70), model:(aiCfgFor? (aiCfgFor(c)||{}).model : '')}); }catch(e){}
        let why=String(r.err).slice(0,60);
        if(/401/.test(why)) why='401 Key 无效或不是这家的 Key';
        else if(/404/.test(why)) why='404 地址不对（要以 /v1 结尾）';
        else if(/429/.test(why)) why='429 太频繁，稍等';
        else if(/failed|fetch/i.test(why)) why='网络不通';
        ch.msgs.push({id:uid('m'), from:'me', type:'system',
          text:'⚠️ 大模型没连上（'+why+'）→ 去 设置→角色引擎 点「测试连接」', ts:Date.now()});
        save();
      }
    }, (r.delay||1000) * (busy? 2.2 : 1) * (c? freqOf(c).delay : 1));
  }).catch(function(err){
    ch.typing=false; save(); refreshChatIfHere(c.id);
    console.error(err);
  });
}

function exportData(){
  let json='';
  try{
    const copy = JSON.parse(JSON.stringify(S));
    let missing=0;
    (function walk(node){
      if(!node || typeof node!=='object') return;
      if(Array.isArray(node)){ for(var i=0;i<node.length;i++) walk(node[i]); return; }
      for(var k in node){
        if(!Object.prototype.hasOwnProperty.call(node,k)) continue;
        var v=node[k];
        if(typeof v==='string'){
          if(v.indexOf('idb:')===0){
            var real=MEM[v.slice(4)];
            if(real) node[k]=real; else missing++;
          }
        }else if(v && typeof v==='object'){ walk(v); }
      }
    })(copy);
    json=JSON.stringify(copy);
    if(missing) toast('有 '+missing+' 张图片找不到，备份不完整');
  }catch(e){ json=JSON.stringify(S); }
  const dlg=document.createElement('div'); dlg.className='mask center';
  dlg.innerHTML='<div class="dialog"><div class="dt">备份数据</div>'
    + '<div style="padding:0 14px 10px"><textarea id="expTxt" style="width:100%;height:120px;font-size:11px;border:.5px solid var(--line);border-radius:8px;padding:8px">'+esc(json)+'</textarea></div>'
    + '<div style="padding:0 14px 8px;font-size:12px;color:var(--sub)">点「全选复制」；不行就长按框里的文字手动复制</div>'
    + '<div class="di"><button data-c>关闭</button><button data-sel>全选</button><button data-copy style="color:var(--green)">复制</button></div></div>';
  dlg.addEventListener('click', function(e){
    if(e.target.closest('[data-sel]')){
      const ta=document.getElementById('expTxt');
      if(ta){ ta.focus(); ta.select(); }
      toast('已全选，长按可复制');
      return;
    }
    if(e.target.closest('[data-copy]')){ copyText(json); return; }
    if(e.target.closest('[data-c]') || e.target===dlg) dlg.remove();
  });
  $('layer').appendChild(dlg);
}

/* ---------- 整段人设 → 字段 ---------- */
function parsePersonaText(raw){
  const text=(raw||'').replace(/\r/g,'').trim();
  if(!text) return null;
  const pick=function(re){ const m=text.match(re); return m? String(m[1]).trim() : ''; };

  let name='', role='';
  // 优先识别 ◆ 角色名（小说体人设常见）
  const lineM = text.match(/^[ \t]*◆\s*([^（(·\n]{1,12})([^\n]*)$/m);
  if(lineM){
    name = lineM[1].trim();
    const r = lineM[2].match(/[·・]\s*([^\n]{1,20})/);
    if(r) role = r[1].trim();
  }
  if(!name){
    let cand = pick(/(?:姓名|名字|昵称|角色名)[：:]\s*([^\s，。；；（(【\n]{1,20})/);
    if(/^(自拟|未知|待定|你|玩家|女主|男主|无|暂无)$/.test(cand)) cand='';
    name = cand || pick(/^#+\s*([^\n]{1,16})/m) || pick(/^【([^】]{1,12})】/m) || '';
  }
  name = name.replace(/(人设|设定|角色|男主|女主)/g,'').trim().slice(0,12);
  if(!role) role = pick(/(?:身份|职业)[：:]\s*([^\n]{1,40})/);
  let relation = pick(/关系[：:]\s*([^\n，。]{1,20})/) || '朋友';
  let catchp = pick(/口头禅[：:]\s*([^\n]{1,40})/) || '';
  if(!catchp){
    const q=text.match(/[“"「]([^”"」]{2,20})[”"」]/);
    if(q) catchp=q[1];
  }
  const interests = pick(/兴趣[：:]\s*([^\n]{1,60})/) || '';

  // 只统计「当前角色那一段」的关键词，避免把另一位角色的性格算进来
  let scope=text;
  const di=text.indexOf('◆');
  if(di>=0){
    const dn=text.indexOf('◆', di+1);
    const ds=text.indexOf('【', di+1);
    let end=text.length;
    if(dn>0) end=Math.min(end,dn);
    if(ds>0) end=Math.min(end,ds);
    scope=text.slice(di, end>di? end : di+3000);
  }
  const kw={
    sharp:/霸道|毒舌|桀骜|嘴硬|魔君|王爷|总裁/g,
    cold:/清冷|冷漠|高冷|孤傲|无情|仙尊|师尊|冷淡|疏离/g,
    warm:/温柔|体贴|心疼|治愈|照顾/g,
    lively:/活泼|元气|可爱|阳光|话多|跳脱/g,
    lit:/文艺|诗意|旧书|雨|月亮|黄昏|寂静/g,
    biz:/商务|干练|效率|报告|项目|公司/g
  };
  let style='lively', best=0;
  Object.keys(kw).forEach(function(k){
    const m=scope.match(kw[k]);
    const n=m? m.length:0;
    if(n>best){ best=n; style=k; }
  });

  const longform = text.length>600 || text.indexOf('【')>=0 || /(^|\n)>\s/.test(text);
  return {name:name, role:role, relation:relation, catchp:catchp,
    interests:interests, style:style, longform:longform,
    persona:text.slice(0,8000)};
}
function applyParsedPersona(p){
  const setV=function(id,v){ const el=$(id); if(el) el.value=v||''; };
  setV('cName', p.name);
  setV('cRole', p.role);
  setV('cRelation', p.relation||'朋友');
  setV('cPersona', p.persona);

  document.querySelectorAll('[data-act="toggle-char"][data-f="longform"]').forEach(function(el){

function pickResponders(g, text){
  const members=groupMembers(g);
  if(!members.length) return [];
  const mentioned=members.filter(function(m){ return text.indexOf(m.name)>=0; });
  if(mentioned.length) return mentioned.slice(0,2);
  const n = Math.random()<0.45? 1:2;
  const pool=members.slice(), out=[];
  for(let i=0;i<n && pool.length;i++){
    out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return out;
}
function groupReplyFlow(g, text, ch){
  const responders=pickResponders(g, text);
  if(!responders.length){ ch.typing=false; return; }
  let i=0;
  function next(){
    if(i>=responders.length){
      ch.typing=false; ch.typingName=''; save(); refreshChatIfHere(g.id); return;
    }
    const m=responders[i++];
    ch.typing=true; ch.typingName=m.name; save(); refreshChatIfHere(g.id);
    generateReplyFor(m, text, ch, g).then(function(r){
      setTimeout(function(){
        ch.typing=false; ch.typingName='';
        const texts=(r.texts&&r.texts.length)? r.texts : ['嗯'];
        texts.forEach(function(t){
          ch.msgs.push({id:uid('m'), from:m.id, type:'text', text:t, ts:Date.now(), read:true});
        });
        addAffinity(m, 2);
        if(Math.random()<0.25) attachment(m, ch);
        save(); refreshChatIfHere(g.id); refreshTabbar();
        setTimeout(next, 650+Math.random()*500);
      }, r.delay||1200);
    });
  }
  next();
}
function attachment(contact, ch){
  const r=Math.random();
  // 1) 自定义表情包（图片或 emoji）
  const custom=(S.stickers||[]);
  if(custom.length && r<0.30){
    const st=custom[Math.floor(Math.random()*custom.length)];
    if(st.k==='img'){
      ch.msgs.push({id:uid('m'), from:contact.id, type:'image', img:st.v, ts:Date.now(), read:true});
    }else{
      ch.msgs.push({id:uid('m'), from:contact.id, type:'sticker', emoji:st.e||'🙂', text:st.t||'', bg:st.bg||'#FFF3D6', ts:Date.now(), read:true});
    }
    save(); return;
  }
  // 2) 网图（角色发一张“网上找的图”）
  const webCfg=(S.settings.webImg)||{on:true, prob:0.10};
  if(webCfg.on && r<0.45){
    const seed=Math.floor(Math.random()*99999);
    const url='https://www.loliapi.com/acg/?_='+seed;
    ch.msgs.push({id:uid('m'), from:contact.id, type:'image', img:url, web:true,
      fallback:'https://t.alcy.cc/pc?_='+seed, ts:Date.now(), read:true});
    ch.msgs.push({id:uid('m'), from:contact.id, type:'text',
      text:pick(['刚刷到的，有点像你。','这张好看吧。','我拍不了，网上找的。','你看这个。']), ts:Date.now(), read:true});
    save(); return;
  }
  const pool=(STICKERS||[]).concat((S.stickers||[]).filter(function(x){ return x.k==='emoji'; }));
  if(r<0.45 && pool.length){
    const s=pool[Math.floor(Math.random()*pool.length)];
    ch.msgs.push({id:uid('m'), from:contact.id, type:'sticker', emoji:s.e, text:s.t, bg:s.bg||'#FFF3D6', ts:Date.now(), read:true});
  }else if(r<0.75 && typeof genPhoto==='function'){
    const img=genPhoto(contact.name, contact.persona);
    if(img) ch.msgs.push({id:uid('m'), from:contact.id, type:'image', img:img, ts:Date.now(), read:true});
  }else{
    const t=pick(['嗯。','在。','……','你说。','好。','知道了。','过来。']);
    ch.msgs.push({id:uid('m'), from:contact.id, type:'voice', text:t, dur:2+Math.floor(Math.random()*9), ts:Date.now(), read:true});
  }
}

function fmtSize(n){
  if(!n) return '0 B';
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  if(n<1024*1024*1024) return (n/1048576).toFixed(2)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
function imgRepoBytes(){
  var n=0;
  try{ for(var k in MEM){ if(MEM[k]) n += MEM[k].length; } }catch(e){}
  return n;
}
function storageBytes(){
  try{ return new Blob([JSON.stringify(S)]).size; }catch(e){ return 0; }
}
function compressDataURL(src, maxW, q){
  return new Promise(function(res){
    if(!src || String(src).indexOf('data:')!==0) return res(src);
    const im=new Image();
    im.onload=function(){
      try{
        const sc=Math.min(1, maxW/(im.width||maxW));
        const w=Math.max(1,Math.round((im.width||maxW)*sc)), h=Math.max(1,Math.round((im.height||maxW)*sc));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        const out=cv.toDataURL('image/jpeg', q||0.8);
        res(out.length < String(src).length? out : src);
      }catch(e){ res(src); }
    };
    im.onerror=function(){ res(src); };
    im.src=src;
  });
}
async function compressAllImages(){
  const before = storageBytes() + imgRepoBytes();
  let n = 0;
  const tasks = [];
  function walk(node){
    if(!node || typeof node!=='object') return;
    if(Array.isArray(node)){ for(var i=0;i<node.length;i++) walk(node[i]); return; }
    for(var k in node){
      if(!Object.prototype.hasOwnProperty.call(node,k)) continue;
      var v=node[k];
      if(typeof v==='string'){
        if((v.indexOf('data:')===0 || v.indexOf('idb:')===0) && v.length>3000){
          (function(obj,key,val){ tasks.push((async function(){
            var real = val.indexOf('idb:')===0 ? (MEM[val.slice(4)]||'') : val;
            if(!real) return;
            var small = await compressDataURL(real, 300, .75);
            if(!small || small===real) return;
            if(val.indexOf('idb:')===0){
              var kk = val.slice(4); MEM[kk]=small;
              try{ await idbPut(kk, small); }catch(e){}
              n++;
            }else{
              obj[key] = await storeImg(small);
              n++;
            }
          })()); })(node,k,v);
        }
      }else if(v && typeof v==='object'){ walk(v); }
    }
  }
  walk(S);
  await Promise.all(tasks);
  window.__quotaShown=false;
  saveNow();
  const after = storageBytes() + imgRepoBytes();
  infoDialog('压缩完成','压缩了 '+n+' 张图片\n占用：'+fmtSize(before)+' → '+fmtSize(after)+'\n（文字存在本机，图片存在 IndexedDB，空间大得多）');
  try{ route(); }catch(e){}
}

/* ---------- 图片处理 ---------- */
function readCompressed(file, maxW, quality){
  return new Promise(function(resolve, reject){
    if(!file) return reject(new Error('没有选中文件'));
    if(file.size > 15*1024*1024) return reject(new Error('图片太大（'+Math.round(file.size/1048576)+'MB），请换一张小一点的'));
    let done=false;
    const ok=function(v){ if(!done){ done=true; clearTimeout(tm); resolve(v); } };
    const bad=function(m){ if(!done){ done=true; clearTimeout(tm); reject(new Error(m)); } };
    const tm=setTimeout(function(){ bad('处理超时，图片可能太大了，换一张试试'); }, 25000);
    const fr=new FileReader();
    fr.onerror=function(){ bad('读取文件失败'); };
    fr.onload=function(){
      const img=new Image();
      img.onerror=function(){ bad('图片解码失败（可能格式不支持），换一张试试'); };
      img.onload=function(){
        try{
          const sc=Math.min(1, (maxW||1080)/Math.max(img.width||maxW, img.height||maxW));
          const w=Math.max(1,Math.round((img.width||maxW)*sc));
          const h=Math.max(1,Math.round((img.height||maxW)*sc));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          ok(cv.toDataURL('image/jpeg', quality||0.78));
        }catch(e){ bad('图片处理失败：'+e.message); }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ---------- 剧情状态 ---------- */
function parseStory(text, contact){
  if(!contact || !contact.story || !contact.story.on) return {text:text, changed:[]};
  const changed=[];
  const out=String(text||'').replace(/[〔【\[(]([\u4e00-\u9fa5A-Za-z]{1,6})([+-])(\d{1,2})[〕】\])]/g, function(all, name, sign, num){
    const delta=(sign==='-'?-1:1)*parseInt(num,10);
    contact.story.stats=contact.story.stats||{};
    if(contact.story.stats[name]===undefined) contact.story.stats[name]=0;
    contact.story.stats[name]=Math.max(0, Math.min(999, contact.story.stats[name]+delta));
    changed.push(name+(delta>0?'+':'')+delta);
    return '';
  }).replace(/\n{3,}/g,'\n\n').trim();
  return {text:out, changed:changed};
}
function randStoryDelta(contact){
  if(!contact || !contact.story || !contact.story.on) return [];
  contact.story.stats=contact.story.stats||{};
  if(!Object.keys(contact.story.stats).length){ contact.story.stats={'好感':10,'黑化':0,'信任':0}; }
  const keys=Object.keys(contact.story.stats);
  const k=keys[Math.floor(Math.random()*keys.length)];
  const d=Math.random()<.72? 1 : -1;
  contact.story.stats[k]=Math.max(0, contact.story.stats[k]+d);
  return [k+(d>0?'+':'')+d];
}

/* 从整篇设定里截出“某个角色”的段落 */
function sliceByCharName(text, name){
  const t=String(text||'');
  const n=String(name||'').trim();
  if(!n) return t;
  let idx=t.indexOf(n);
  if(idx<0) return t;
  // 往前退到行首
  const lineStart=t.lastIndexOf('\n', idx);
  if(lineStart>0 && idx-lineStart<40) idx=lineStart;
  let rest=t.slice(idx);
  // 终点：下一个角色标题/分隔/【】/## 
  const m=rest.slice(n.length).match(/\n\s*(?:【|#{1,3}\s|第[一二三四五六七八九十0-9]+[章节位]|---+\s*\n)/);
  let seg = m? rest.slice(0, n.length + m.index) : rest.slice(0, 1600);
  if(seg.length<120 && rest.length>seg.length){ seg=rest.slice(0,1600); }
  return (n+'\n'+seg).trim();
}

/* ---------- 长期记忆 ---------- */
const FACT_RULES=[
  {re:/(?:我叫|我的名字是|我是)\s*([\u4e00-\u9fa5A-Za-z0-9]{1,8})/, t:function(m){ return '用户叫「'+m[1]+'」'; }},
  {re:/(?:我今年|我)\s*(\d{1,2})\s*岁/, t:function(m){ return '用户今年'+m[1]+'岁'; }},
  {re:/我(?:很|超|最)?(?:喜欢|爱)\s*([^，。！？\s]{1,10})/, t:function(m){ return '用户喜欢'+m[1]; }},
  {re:/(?:我(?:最)?(?:讨厌|不喜欢|受不了))\s*([^，。！？\s]{1,10})/, t:function(m){ return '用户讨厌'+m[1]; }},
  {re:/(?:我在|我在)\s*([^，。！？\s]{2,10})\s*(?:上班|工作|读书|上学)/, t:function(m){ return '用户在'+m[1]+'工作/学习'; }},
  {re:/(?:我住在|我家在|我搬到)\s*([^，。！？\s]{2,10})/, t:function(m){ return '用户住在'+m[1]; }},
  {re:/(?:我生日|下个月\d+号是我生日)\s*(?:是)?\s*(\d{1,2})[月\/-](\d{1,2})/, t:function(m){ return '用户生日是'+m[1]+'月'+m[2]+'日'; }},
  {re:/(?:明天|后天|周末)\s*(?:要|得|会)\s*([^，。！？]{2,16})/, t:function(m){ return '用户提过要'+m[1]; }}
];
function extractFacts(text){
  const out=[];
  FACT_RULES.forEach(function(r){
    const m=String(text||'').match(r.re);
    if(m){ try{ out.push(r.t(m)); }catch(e){} }
  });
  // 反问句、疑问不算事实
  return out.filter(function(x){ return x.length<40; });
}
function rememberFacts(contact, text){
  if(!contact || contact.isGroup) return;
  const facts=extractFacts(text);
  if(!facts.length) return;
  contact.mem = contact.mem || [];
  facts.forEach(function(f){
    if(contact.mem.some(function(x){ return x.f===f; })) return;
    contact.mem.push({f:f, ts:Date.now()});
  });
  while(contact.mem.length>40) contact.mem.shift();
  save();
}

    el.innerHTML='<div style="width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite"></div><div id="__busyTxt"></div>';
    document.body.appendChild(el);
  }
  const t=document.getElementById('__busyTxt'); if(t) t.textContent=text||'处理中…';
  el.style.display='flex';
  return el;
}
function busyDone(){ const el=document.getElementById('__busy'); if(el) el.style.display='none'; }
async function pickImage(file, maxW, q, inline){
  let w=maxW||1080, quality=q||.8;
  if(inline){ w=Math.min(w, 900); quality=Math.min(quality, .72); }
  if(typeof IDB_OK!=='undefined' && !IDB_OK){ w=Math.min(w, 640); quality=Math.min(quality, .55); }
  const data=await readCompressed(file, w, quality);
  let ref=data;
  try{ ref=await storeImg(data); }catch(e){ ref=data; }
  if(!ref || typeof ref!=='string') throw new Error('图片保存失败');
  if(inline){
    // 背景直接内联，最稳
    let url=data;
    if(url.length > 260*1024){ url=await readCompressed(file, 640, .55); }
    if(url.length > 320*1024){ url=await readCompressed(file, 480, .45); }
    return url;
  }
  if(!IDB_OK && ref.length > 900*1024){
    const smaller=await readCompressed(file, 480, .45);
    return smaller;
  }
  return ref;
}
function readRaw(file){
  return new Promise(function(res, rej){
    const fr=new FileReader();
    fr.onload=function(){ res(String(fr.result)); };
    fr.onerror=function(){ rej(new Error('读取失败')); };
    fr.readAsDataURL(file);
  });
}
function onFilePick(e){
  const files=Array.from(e.target.files||[]);
  e.target.value='';
  if(!files.length) return;
  const mode=FILE_MODE;
  if(mode==='chat-image'){
    (async function(){
      for(const f of files.slice(0,4)){
        const url=await pickImage(f, 900, .72);
        pushMsg(curChatId, {from:'me', type:'image', img:url, ts:Date.now(), read:true});
        refreshChat();
      }
      const cc=contactById(curChatId);
      if(cc && !cc.isGroup){
        const cfg=(typeof aiCfgFor==='function')? aiCfgFor(cc) : {mode:'local'};
        if(cfg.mode==='api' && !cfg.vision){
          // 不支持视觉：让模型按"收到一张图"自然回应
          setTimeout(function(){
            const ch2=chatOf(cc.id);
            generateReply(cc, '（我刚给你发了一张图片/表情包，你看不到内容但要自然回应一下，20字以内）', ch2)
              .then(function(r){
                const t=(r.texts&&r.texts[0])||'这图可以。';
                ch2.msgs.push({id:uid('m'), from:cc.id, type:'text', text:String(t).slice(0,80), ts:Date.now(), read:true});
                save(); refreshChatIfHere(cc.id); refreshTabbar();
              }).catch(function(){});
          }, 900);
        }
        if(cfg.mode==='api' && cfg.vision){
          const last=chatOf(curChatId).msgs.filter(function(m){ return m.type==='image' && m.from==='me'; }).pop();
          const img=(typeof imgSrc==='function')? imgSrc(last&&last.img) : '';
          replyFlow(cc, '（我发了一张图片给你）', chatOf(curChatId), false, img);
        }
      }
      save();
      const c=contactById(curChatId), ch=chatOf(curChatId);
      if(c && Math.random()<0.75){
        ch.typing=true; save(); refreshChatIfHere(c.id);
        setTimeout(function(){
          ch.typing=false;
          const t=pick(['这是哪儿？','拍得不错啊','收到','这图有点意思','你发这个干嘛']);
          ch.msgs.push({id:uid('m'), from:c.id, type:'text', text:t, ts:Date.now(), read:true});
          save(); refreshChatIfHere(c.id);
        }, 1400+Math.random()*1200);
      }
    })();
  }
  if(mode==='moment-image'){
    (async function(){
      for(const f of files.slice(0, Math.max(0, 9-DRAFT.moment.imgs.length))){
        const url=await pickImage(f, 900, .72);
        DRAFT.moment.imgs.push({k:'img', v:url});
      }
      renderMomentImgs();
    })();
  }
  if(mode==='bg' || mode==='chatbg'){
    (async function(){
      const f=files[0];
      try{
        diag('bg-picked', {name:(f.name||'').slice(-12), size:f.size});
        bgStatus('① 已选择：'+(f.name||'图片')+'（'+fmtSize(f.size)+'）');
        busyOverlay('正在处理图片…');
        let url='';
        try{
          url=await pickImage(f, 1080, .78, true);
          diag('bg-compressed', {len:url.length});
        bgStatus('② 处理完成：'+fmtSize(url.length));
        }catch(err1){
          bgStatus('② 压缩失败（'+(err1&&err1.message||err1)+'），改用原图');
          bgStatus('② 压缩失败（'+(err1&&err1.message||err1)+'），改用原图');
          url=await readRaw(f);
          if(url.length > 2.2*1024*1024) throw new Error('图片太大（'+fmtSize(url.length)+'），请先截图再试');
          bgStatus('② 已用原图：'+fmtSize(url.length));
        }
        if(!url) throw new Error('没拿到图片数据');
        if(mode==='chatbg'){
          const cid=(window.__route==='chatbg')? (location.hash.split('/')[2]) : curChatId;
          if(!cid) throw new Error('没有找到聊天');
          chatOf(cid).bg={k:'img', v:url};
        }else{
          S.settings.bg={k:'img', v:url};
        }
        bgStatus('③ 保存中…');
        saveNow();
        const stillThere = (mode==='chatbg')
          ? !!(window.__route==='chatbg' ? chatOf(location.hash.split('/')[2]).bg : true)
          : !!S.settings.bg;
        if(!stillThere) throw new Error('写入后没找到背景数据');
        busyDone();
        diag('bg-ok', {bytes:storageBytes()});
        bgStatus('④ 设置成功 ✓  存档占用 '+fmtSize(storageBytes()), true);
        toast('聊天背景已设置');
        applySettings(); route();
      }catch(err){
        busyDone();
        diag('bg-fail', {err:(err&&err.message||String(err)).slice(0,80)});
        bgStatus('✗ 失败：'+(err&&err.message||err), false);
        toast('设置失败：'+(err&&err.message||err));
      }
    })();
  }
  if(mode==='voiceclone'){
    (async function(){
      try{
        busyOverlay('正在克隆音色…');
        const uri=await cloneVoice(files[0], (ED&&ED.name)||'voice');
        busyDone();
        if(ED){ ED.voiceClone={uri:uri, name:(files[0].name||'').slice(-16)}; }
        const c=ED&&ED.id? contactById(ED.id):null;
        if(c){ c.voiceClone={uri:uri, name:(files[0].name||'').slice(-16)}; save(); }
        infoDialog('音色克隆成功','已保存到'+(ED&&ED.name? '「'+ED.name+'」':'当前角色')+'。\n点角色音色区的「试听」就能听到。');
        route();
      }catch(e){
        busyDone();
        infoDialog('克隆失败', String(e&&e.message||e));
      }
    })();
  }
  if(mode==='sticker'){
    (async function(){
      try{
        const url=await pickImage(files[0], 300, .8);
        S.stickers.push({k:'img', v:url, bg:'#fff'});
        save(); route(); toast('表情包已添加');
      }catch(e){ toast('添加失败：'+(e.message||e)); }
    })();
  }
  if(mode==='appbg'){
    (async function(){
      try{
        toast('正在处理图片…');
        busyOverlay('正在处理图片…');
        const url=await pickImage(files[0], 1200, .72, true);
        busyDone();
        S.settings.appBg={k:'img', v:url};
        await saveNow();
        applySettings(); route(); toast('整体背景已设置');
      }catch(err){ toast('设置失败：'+(err&&err.message||err)); }
    })();
  }
  if(mode==='cover'){
    (async function(){
      const url=await pickImage(files[0], 1200, .78);
      S.me.cover=url; await saveNow(); route(); toast('封面已更新');
    })();
  }
  if(mode==='avatar-me'){
    (async function(){
      const url=await pickImage(files[0], 300, .8);
      S.me.avatar={k:'img', v:url}; await saveNow(); route(); toast('头像已更新');
    })();
  }
  if(mode==='avatar-char'){
    (async function(){
      const url=await pickImage(files[0], 300, .8);
      if(ED) ED.avatar={k:'img', v:url};
      const pv=$('avPreview');
      if(pv) pv.innerHTML = avHTML(ED? ED.avatar : {k:'img',v:url}, 'lg') + '<span class="hint">当前头像（已上传）</span>';
      toast('头像已选择，记得保存');
    })();
  }
}

/* ---------- 主动互动 ---------- */
function warmStart(){
  try{
    if(!S.settings.autoPost) return;
    const lastAuto = S.meta.lastAutoPost || 0;
    if(Date.now() - lastAuto < 25*60*1000) return;
    S.meta.lastAutoPost = Date.now(); save();
    // 1) 可能有人发朋友圈
    if(Math.random()<0.45){
      const cs=S.contacts.filter(function(c){ return c.active!==false; });
      if(cs.length){
        const c=cs[Math.floor(Math.random()*cs.length)];
        if(c){
          const p=momentPost(c);
          const m={id:uid('mo'), author:c.id, text:p.text, imgs:p.imgs, ts:Date.now(),
            vis:{mode:'all', ids:[]}, likes:[], comments:[], location:''};
          S.moments.unshift(m); S.meta.momentsDot=true; save(); refreshTabbar();
          if(window.__route==='moments') refreshFeed();
        }
      }
    }
    // 2) 可能有人主动找你
    if(Math.random()<0.5){
      const cands=S.contacts.filter(function(c){
        if(c.active===false) return false;
        const ch=chatOf(c.id); const lm=lastMsg(ch);
        return !lm || (Date.now()-lm.ts) > 3*H;
      });
      if(cands.length){
        const c=cands[Math.floor(Math.random()*cands.length)];
        setTimeout(function(){
          const ch=chatOf(c.id);
          const text=initiateText(c);
          ch.msgs.push({id:uid('m'), from:c.id, type:'text', text:text, ts:Date.now(), read:false});
          ch.unread=(ch.unread||0)+1;
          save();
          if(window.__route==='chat' && curChatId===c.id){ ch.unread=0; save(); refreshChat(); }
          refreshTabbar();
          if(window.__route==='chats') softRerender();
          toast(c.name+' 发来一条消息', true);
        }, 4000+Math.random()*6000);
      }
    }
  }catch(e){ console.warn('warmStart', e); }
}
